/* ----- Génération : moteur démo (sans IA) ----- */
const sentencesOf = t => String(t).replace(/^#+\s.*$/gm, '').replace(/^[-*•]\s+/gm, '').replace(/\s+/g, ' ').split(/(?<=[.!?])\s+(?=[A-ZÀ-Ý0-9«"])/).map(s => s.trim()).filter(s => wordCount(s) >= 6 && wordCount(s) <= 40);
const shortTitle = t => { const w = String(t).replace(/[#*_`]/g, '').replace(/[.:;,!?]+$/, '').trim().split(/\s+/); return (w.slice(0, 8).join(' ') + (w.length > 8 ? '…' : '')).replace(/^./, c => c.toUpperCase()); };
function detectHeadings(lines) {
  const out = [];
  lines.forEach((raw, i) => {
    const t = raw.trim(); if (!t) return;
    let m;
    if ((m = t.match(/^(#{1,6})\s+(.+)/))) { out.push({ i, level: m[1].length, title: m[2].trim() }); return; }
    if (/^(module|partie|section)\s+\d+\s*[:.\-–]?\s*\S/i.test(t) && t.length < 100) { out.push({ i, level: 1, title: t.replace(/^(module|partie|section)\s+\d+\s*[:.\-–]?\s*/i, '') }); return; }
    if (/^(chapitre|étape|etape|leçon|lecon)\s+\d+\s*[:.\-–]?\s*\S/i.test(t) && t.length < 100) { out.push({ i, level: 2, title: t.replace(/^(chapitre|étape|etape|leçon|lecon)\s+\d+\s*[:.\-–]?\s*/i, '') }); return; }
    const prevBlank = i === 0 || !lines[i - 1].trim(), nextBlank = i === lines.length - 1 || !lines[i + 1].trim();
    if (t.length >= 4 && t.length < 70 && /[A-ZÀ-Ý]{3}/.test(t) && t === t.toUpperCase() && prevBlank) { out.push({ i, level: 1, title: t.charAt(0) + t.slice(1).toLowerCase() }); return; }
    if (prevBlank && nextBlank && t.length < 70 && wordCount(t) <= 9 && !/[.;,:!?]$/.test(t) && !/^[-*•\d]/.test(t)) {
      const after = lines.slice(i + 1, i + 8).join(' ');
      if (wordCount(after) > 20) out.push({ i, level: 3, title: t });
    }
  });
  return out;
}
function chunkText(text, size) {
  const paras = text.split(/\n{2,}/).map(p => p.trim()).filter(Boolean), chunks = [];
  let cur = [];
  paras.forEach(p => { cur.push(p); if (wordCount(cur.join(' ')) >= size) { chunks.push(cur.join('\n\n')); cur = []; } });
  if (cur.length) { if (chunks.length && wordCount(cur.join(' ')) < size / 3) chunks[chunks.length - 1] += '\n\n' + cur.join('\n\n'); else chunks.push(cur.join('\n\n')); }
  return chunks;
}
function demoGenerate(sources, st) {
  const text = sources.map(s => s.text).join('\n\n').slice(0, MAX_SOURCE_CHARS).replace(/\r/g, '');
  const lines = text.split('\n');
  const heads = detectHeadings(lines);
  const levels = [...new Set(heads.map(h => h.level))].sort((a, b) => a - b);
  const bodyBetween = (a, b) => lines.slice(a, b).join('\n').trim();
  let chapters = []; // { title, body, moduleTitle? }
  let modulesRaw = null;
  if (levels.length >= 2) {
    const top = levels[0], sub = levels[1];
    modulesRaw = [];
    heads.forEach((h, k) => {
      const end = k + 1 < heads.length ? heads[k + 1].i : lines.length;
      if (h.level === top) modulesRaw.push({ title: h.title, chapters: [], intro: bodyBetween(h.i + 1, end) });
      else if (h.level === sub || h.level > sub) {
        if (!modulesRaw.length) modulesRaw.push({ title: shortTitle(sources[0].name.replace(/\.\w+$/, '')), chapters: [], intro: '' });
        const mod = modulesRaw[modulesRaw.length - 1];
        if (h.level === sub) mod.chapters.push({ title: h.title, body: bodyBetween(h.i + 1, end) });
        else if (mod.chapters.length) mod.chapters[mod.chapters.length - 1].body += `\n\n### ${h.title}\n\n` + bodyBetween(h.i + 1, end);
      }
    });
    modulesRaw.forEach(m => { if (m.intro && wordCount(m.intro) > 25) m.chapters.unshift({ title: 'Introduction', body: m.intro }); if (!m.chapters.length) chunkText(m.intro, 220).forEach((c, k) => m.chapters.push({ title: k ? shortTitle(sentencesOf(c)[0] || m.title) : m.title, body: c })); });
    modulesRaw = modulesRaw.filter(m => m.chapters.length);
  } else if (levels.length === 1) {
    const pre = heads.length ? bodyBetween(0, heads[0].i) : '';
    if (wordCount(pre) > 25) chapters.push({ title: 'Introduction', body: pre });
    heads.forEach((h, k) => chapters.push({ title: h.title, body: bodyBetween(h.i + 1, k + 1 < heads.length ? heads[k + 1].i : lines.length) }));
  } else {
    // Pas de titres (dictée, notes) : découpage en blocs d'environ 200 mots
    chapters = chunkText(text, 200).map(c => ({ title: shortTitle(sentencesOf(c)[0] || c.split('\n')[0]), body: c }));
  }
  const prettyName = n => shortTitle(String(n).replace(/\.\w+$/, '').replace(/[_-]+/g, ' '));
  const firstLine = lines.find(l => l.trim());
  const firstIsHead = heads.length && firstLine && lines.indexOf(firstLine) === heads[0].i;
  const docTitle = st.title || (firstIsHead ? heads[0].title : sources.length === 1 ? prettyName(sources[0].name) : prettyName(sources.find(x => x.kind !== 'paste' && x.kind !== 'voice')?.name || 'Nouveau cursus'));
  if (!modulesRaw) {
    chapters = chapters.filter(c => wordCount(c.body) > 0);
    const n = st.modules === 'auto' ? Math.max(1, Math.min(8, Math.ceil(chapters.length / 3))) : Math.min(+st.modules, chapters.length || 1);
    const per = Math.ceil(chapters.length / n);
    modulesRaw = [];
    for (let i = 0; i < chapters.length; i += per) {
      const group = chapters.slice(i, i + per);
      const named = group.find(g => g.title !== 'Introduction') || group[0];
      modulesRaw.push({ title: n === 1 && group.length > 1 ? docTitle : named.title, chapters: group });
    }
  } else if (st.modules !== 'auto' && modulesRaw.length > +st.modules) {
    // Regroupe les modules en trop pour respecter le nombre demandé
    const n = +st.modules, per = Math.ceil(modulesRaw.length / n), merged = [];
    for (let i = 0; i < modulesRaw.length; i += per) { const g = modulesRaw.slice(i, i + per); merged.push({ title: g[0].title, chapters: g.flatMap(x => x.chapters.length === 1 ? x.chapters : x.chapters.map(c => ({ ...c, title: c.title === 'Introduction' ? x.title : c.title }))) }); }
    modulesRaw = merged;
  }
  // Leçons : une par chapitre, découpée si le texte est long
  const allSentences = modulesRaw.map(m => m.chapters.map(c => ({ chapter: c.title, list: sentencesOf(c.body) })));
  const modules = modulesRaw.map((m, mi) => {
    const chaps = m.chapters.map(c => {
      const parts = wordCount(c.body) > 500 ? chunkText(c.body, 350) : [c.body];
      return { title: c.title, lessons: parts.map((p, k) => {
        const bullets = (p.match(/^[-*•]\s+.+$/gm) || []).map(b => b.replace(/^[-*•]\s+/, '').trim()).filter(b => b.length < 140).slice(0, 4);
        const keys = bullets.length ? bullets : sentencesOf(p).slice(0, 3).map(s => s.length > 110 ? s.slice(0, 107) + '…' : s);
        return { title: parts.length > 1 ? `${c.title} (${k + 1}/${parts.length})` : c.title, est_minutes: Math.max(5, Math.round(wordCount(p) / 150) + 3), content: p,
                 checklist: st.checklist ? keys.map(x => 'J\'ai compris : ' + x.replace(/^./, ch => ch.toLowerCase())) : [] };
      }) };
    });
    const first = sentencesOf(m.chapters.map(c => c.body).join(' '))[0];
    const lessonsMin = chaps.reduce((s, c) => s + c.lessons.reduce((a, l) => a + l.est_minutes, 0), 0);
    let quiz = null;
    if (st.quiz) {
      const others = allSentences.filter((_, k) => k !== mi).flat().flatMap(x => x.list.map(s => ({ s, chapter: x.chapter })));
      const pool = others.length >= 2 ? others : allSentences[mi].flatMap(x => x.list.map(s => ({ s, chapter: x.chapter })));
      const questions = allSentences[mi].filter(x => x.list.length).slice(0, 3).map((x, k) => {
        const good = x.list[Math.min(1, x.list.length - 1)];
        const wrong = pool.filter(p => p.s !== good && p.chapter !== x.chapter).sort((a, b) => ((a.s.length * 7 + k) % 13) - ((b.s.length * 7 + k) % 13)).slice(0, 2);
        if (wrong.length < 2) return null;
        const opts = [{ text: good, correct: true, feedback: 'Exact.' }, ...wrong.map(w => ({ text: w.s, correct: false, feedback: `Non : cette affirmation concerne « ${w.chapter} ».` }))];
        const rot = k % 3; return { prompt: `Laquelle de ces affirmations est expliquée dans « ${x.chapter} » ?`, options: [...opts.slice(rot), ...opts.slice(0, rot)], explanation: '' };
      }).filter(Boolean);
      if (questions.length) quiz = { pass_score: 80, questions };
    }
    const exercise = st.exercises ? { title: 'Exercice pratique', submission_type: 'both',
      instructions: `Mettez en pratique « ${m.title} » sur un cas réel : appliquez les étapes vues dans ce module, puis déposez votre travail (fichier ou lien) avec une courte note expliquant vos choix.` } : null;
    return { title: m.title, objective: first ? (first.length > 180 ? first.slice(0, 177) + '…' : first) : `Comprendre et appliquer « ${m.title} ».`,
             est_minutes: lessonsMin + (quiz ? 10 : 0) + (exercise ? 30 : 0), chapters: chaps, quiz, exercise };
  });
  const desc = sentencesOf(text)[0] || '';
  return { title: docTitle,
           description: desc.length > 200 ? desc.slice(0, 197) + '…' : desc, modules };
}

function sourcesBlock(sources) {

  }).join('\n\n');
}
function paramsText(st, folderNames) {
  return `Paramètres :
- Destinataires : ${folderNames.length ? folderNames.join(', ') : 'collaborateurs Hike UP'}${folderNames.length > 1 ? ' (tronc commun partagé par plusieurs rôles : reste général, sans spécificité d\'un seul rôle)' : ''}
- Niveau : ${LEVEL_TXT[st.level] || st.level}
- Nombre de modules : ${st.modules === 'auto' ? 'à déterminer selon le contenu (2 à 7 en général)' : st.modules}
- Durée cible : ${DURATION_TXT[st.duration] || st.duration}
- Quiz par module : ${st.quiz ? 'oui' : 'non'}
- Exercice pratique par module : ${st.exercises ? 'oui' : 'non'}
- Checklist par leçon : ${st.checklist ? 'oui' : 'non'}
${st.title ? `- Titre imposé : ${st.title}\n` : ''}${st.instructions ? `- Consignes supplémentaires : ${st.instructions}\n` : ''}`;
}
/* Construit la requête Claude pour un appel "outline" ou "module" */
function buildClaudeRequest(kind, p) {
  const system = [{ type: 'text', text: COURSE_RULES }, { type: 'text', text: sourcesBlock(p.sources), cache_control: { type: 'ephemeral' } }];
  if (kind === 'outline') {
    return { system, max_tokens: 4000, tool: PLAN_TOOL,
      user: `${paramsText(p.settings, p.folderNames)}\nÉtablis le plan du cursus à partir des sources : titre, description (1 à 2 phrases), modules avec objectif et durée, chapitres et titres des leçons. Le plan doit couvrir tout le contenu utile des sources, dans un ordre progressif. Appelle l'outil plan_course.` };
  }
  const m = p.outline.modules[p.index];
  return { system, max_tokens: 8000, tool: MODULE_TOOL,
    user: `${paramsText(p.settings, p.folderNames)}\nPlan complet du cursus « ${p.outline.title} » :\n${p.outline.modules.map((x, i) => `${i + 1}. ${x.title} : ${x.chapters.map(c => c.title).join(' ; ')}`).join('\n')}\n\nRédige maintenant en entier le module ${p.index + 1} « ${m.title} » (objectif : ${m.objective}).\nChapitres et leçons prévus :\n${m.chapters.map(c => `- ${c.title} : ${(c.lessons || []).join(' / ')}`).join('\n')}\n\nNe traite que ce module (les autres sont rédigés séparément, évite les doublons). ${p.settings.quiz ? 'Inclus le quiz.' : 'N\'inclus pas de quiz.'} ${p.settings.exercises ? 'Inclus l\'exercice pratique.' : 'N\'inclus pas d\'exercice.'} Appelle l'outil write_module.` };
}
async function callClaude(kind, payload) {
  if (studio.engine === 'supabase') {
    const { data, error } = await sb.functions.invoke('generate-course', { body: { kind, ...payload } });
    if (error) throw new Error(error.message || 'Erreur de la fonction generate-course');
    if (!data || !data.result) throw new Error((data && data.error) || 'Réponse vide.');
    return data.result;
  }
  const r = buildClaudeRequest(kind, payload);
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-api-key': studio.apiKey.trim(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: AI_MODEL, max_tokens: r.max_tokens, system: r.system, messages: [{ role: 'user', content: r.user }], tools: [r.tool], tool_choice: { type: 'tool', name: r.tool.name } }),
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((json.error && json.error.message) || `Erreur ${res.status}`);
  if (json.stop_reason === 'max_tokens') throw new Error('Réponse tronquée : réduisez le nombre de modules ou la taille des sources.');
  const block = (json.content || []).find(b => b.type === 'tool_use');
  if (!block) throw new Error("La réponse de l'IA ne contient pas le résultat attendu.");
  return block.input;
}
/* Exécute des tâches avec un nombre limité d'appels simultanés */
async function pool(items, limit, fn) {
  const out = new Array(items.length); let next = 0;
  const worker = async () => { while (next < items.length) { const i = next++; out[i] = await fn(items[i], i); } };
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
  return out;
}
async function generateWithClaude(sources, st, folderNames) {
  const payload = { sources: sources.map(s => ({ name: s.name, kind: s.kind, text: s.text })), settings: st, folderNames };
  const outline = await callClaude('outline', payload);
  if (!outline || !(outline.modules || []).length) throw new Error('Le plan généré est vide.');
  studio.progress = { outline: 'done', modules: outline.modules.map(m => ({ title: m.title, state: 'wait' })) };
  renderStudioSafe();
  const writeOne = async (m, i) => {
    studio.progress.modules[i].state = 'run'; renderStudioSafe();
    let res;
    try { res = await callClaude('module', { ...payload, outline, index: i }); }
    catch (err) { res = await callClaude('module', { ...payload, outline, index: i }); } // une nouvelle tentative
    studio.progress.modules[i].state = 'done'; renderStudioSafe();
    return { title: m.title, objective: m.objective, est_minutes: m.est_minutes, chapters: res.chapters || [], quiz: res.quiz || null, exercise: res.exercise || null };
  };
  // Le 1er module seul (il réutilise le cache créé par le plan), puis les autres en parallèle
  const first = await writeOne(outline.modules[0], 0);
  const rest = await pool(outline.modules.slice(1), 3, (m, i) => writeOne(m, i + 1));
  return { title: outline.title, description: outline.description, modules: [first, ...rest] };
}
function normalizeDraft(raw, st) {
  const d = raw || {};
  const modules = (d.modules || []).map(m => ({
    title: String(m.title || 'Module'), objective: String(m.objective || ''), est_minutes: +m.est_minutes || 30,
    chapters: (m.chapters || []).map(c => ({ title: String(c.title || 'Chapitre'), lessons: (c.lessons || []).map(l => ({
      title: String(l.title || c.title || 'Leçon'), est_minutes: +l.est_minutes || 10, content: String(l.content || ''),
      checklist: st.checklist && Array.isArray(l.checklist) ? l.checklist.map(String) : [] })) })).filter(c => c.lessons.length),
    quiz: st.quiz && m.quiz && (m.quiz.questions || []).length ? { pass_score: +m.quiz.pass_score || 80, questions: m.quiz.questions.map(q => {
      const opts = (q.options || []).map(o => ({ text: String(o.text || ''), correct: !!o.correct, feedback: String(o.feedback || '') }));
      if (opts.length && !opts.some(o => o.correct)) opts[0].correct = true;
      return { prompt: String(q.prompt || ''), explanation: String(q.explanation || ''), options: opts };
    }).filter(q => q.options.length >= 2) } : null,
    exercise: st.exercises && m.exercise ? { title: String(m.exercise.title || 'Exercice pratique'), instructions: String(m.exercise.instructions || ''), submission_type: m.exercise.submission_type || 'both' } : null,
  })).filter(m => m.chapters.length);
  return { title: st.title || String(d.title || 'Nouveau cursus'), description: String(d.description || ''), modules };
}
async function runGeneration() {
  const st = studio.settings;
  if (!st.folders.length) { studio.error = 'Choisissez au moins un dossier de destination.'; render(true); return; }
  if (studio.engine === 'key' && !/^sk-ant-/.test(studio.apiKey.trim())) { studio.error = 'Saisissez une clé API Anthropic valide (elle commence par sk-ant-).'; render(true); return; }
  studio.error = null; studio.busy = true; studio.progress = { outline: 'run', modules: [] }; render(true);
  const folderNames = st.folders.map(id => (byId('folders', id) || {}).name).filter(Boolean);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  try {
    let raw;
    if (studio.engine === 'demo') {
      raw = demoGenerate(studio.sources, st);
      await wait(700);
      studio.progress = { outline: 'done', modules: raw.modules.map(m => ({ title: m.title, state: 'wait' })) }; renderStudioSafe();
      for (const m of studio.progress.modules) { m.state = 'run'; renderStudioSafe(); await wait(350); m.state = 'done'; }
      renderStudioSafe(); await wait(300);
    } else raw = await generateWithClaude(studio.sources, st, folderNames);
    const draft = normalizeDraft(raw, st);
    if (!draft.modules.length) throw new Error('Aucun module n\'a pu être généré : ajoutez davantage de contenu.');
    studio.draft = draft; studio.draftEngine = studio.engine; studio.openMods = new Set([0]); studio.step = 3;
  } catch (err) {
    studio.error = 'La génération a échoué : ' + (err.message || err);
    studio.step = 2;
  } finally {
    studio.busy = false; renderStudioSafe();
  }
}

/* ----- Publication du brouillon dans la base ----- */
function publishDraft(publish) {
  const d = studio.draft, st = studio.settings;
  if (!d.title.trim()) { toast('Donnez un titre au cursus.'); return; }
  if (!d.modules.length) { toast('Le cursus ne contient aucun module.'); return; }
  if (!st.folders.length) { toast('Choisissez au moins un dossier (étape Réglages).'); return; }
  const pid = uid('p');
  DB.paths.push({ id: pid, title: d.title.trim(), description: d.description, unlock_mode: st.unlock, published: !!publish, source: 'ai' });
  let prev = null;
  d.modules.forEach((m, i) => {
    const mid = uid('m');
    DB.modules.push({ id: mid, path_id: pid, position: i + 1, title: m.title, objective: m.objective, est_minutes: +m.est_minutes || 0,
                      prerequisites: st.unlock === 'sequential' && prev ? [prev] : [], tool_id: null, badge_label: m.title });
    prev = mid;
    let lastChap = null, lastPos = 0;
    m.chapters.forEach((c, j) => {
      const cid = uid('c'); lastChap = cid;
      DB.chapters.push({ id: cid, module_id: mid, position: j + 1, title: c.title });
      c.lessons.forEach((l, k) => {
        const blocks = [{ type: 'text', html: mdToHtml(l.content) }];
        const items = (l.checklist || []).map(x => x.trim()).filter(Boolean);
        if (items.length) blocks.push({ type: 'checklist', title: 'Points clés', items });
        DB.lessons.push({ id: uid('l'), chapter_id: cid, position: k + 1, title: l.title, kind: 'content', est_minutes: +l.est_minutes || 10, blocks });
        lastPos = k + 1;
      });
    });
    if ((m.quiz && m.quiz.questions.length) || m.exercise) {
      if (!lastChap) { lastChap = uid('c'); DB.chapters.push({ id: lastChap, module_id: mid, position: 1, title: 'Évaluation' }); }
    }
    if (m.quiz && m.quiz.questions.length) {
      const lid = uid('l'), qid = uid('q');
      DB.lessons.push({ id: lid, chapter_id: lastChap, position: ++lastPos, title: 'Quiz de validation', kind: 'quiz', est_minutes: Math.max(5, m.quiz.questions.length * 2), blocks: [] });
      DB.quizzes.push({ id: qid, lesson_id: lid, pass_score: +m.quiz.pass_score || 80, max_attempts: null });
      m.quiz.questions.forEach((q, k) => DB.questions.push({ id: uid('qq'), quiz_id: qid, position: k + 1, prompt: q.prompt, explanation: q.explanation,
        options: q.options.map((o, n) => ({ id: 'abcdefgh'[n], text: o.text, correct: !!o.correct, feedback: o.feedback })) }));
    }
    if (m.exercise) {
      const lid = uid('l');
      DB.lessons.push({ id: lid, chapter_id: lastChap, position: ++lastPos, title: m.exercise.title || 'Exercice pratique', kind: 'exercise', est_minutes: 45, blocks: [] });
      DB.exercises.push({ id: uid('e'), lesson_id: lid, instructions: m.exercise.instructions, submission_type: m.exercise.submission_type || 'both' });
    }
  });
  st.folders.forEach(fid => {
    const pos = Math.max(0, ...DB.folder_paths.filter(fp => fp.folder_id === fid).map(fp => fp.position)) + 1;
    DB.folder_paths.push({ folder_id: fid, path_id: pid, position: pos });
    if (publish && st.enroll) syncFolderEnrollments(fid);
  });
  DB.ai_generations.push({ id: uid('gen'), path_id: pid, engine: studio.draftEngine, created_by: me.id, created_at: new Date().toISOString(),
                           settings: { ...st }, sources: studio.sources.map(s => ({ name: s.name, kind: s.kind, words: s.words })) });
  resetStudio();
  navigate('path/' + pid);
  toast(publish ? 'Cursus publié.' : 'Cursus enregistré en brouillon.');
}

/* ----- Liaison des champs du studio (sans re-rendu, pour garder le focus) ----- */
function setByPath(obj, path, val) {
  const keys = path.split('.'); let o = obj;
  for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
  o[keys[keys.length - 1]] = val;
}
function getByPath(obj, path) { return path.split('.').reduce((o, k) => o == null ? o : o[k], obj); }
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.bind) setByPath(studio, el.dataset.bind, el.type === 'checkbox' ? el.checked : el.value);
  else if (el.dataset.d && studio.draft) {
    let v = el.value;
    if (el.dataset.num) v = +v || 0;
    if (el.dataset.lines) v = v.split('\n').map(x => x.trim()).filter(Boolean);
    setByPath(studio.draft, el.dataset.d, v);
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.bind && (el.type === 'checkbox' || el.tagName === 'SELECT')) { setByPath(studio, el.dataset.bind, el.type === 'checkbox' ? el.checked : el.value); if (el.dataset.bind === 'settings.enroll') return; render(true); }
  else if (el.dataset.folder) {
    const f = el.dataset.folder, list = studio.settings.folders;
    studio.settings.folders = el.checked ? [...new Set([...list, f])] : list.filter(x => x !== f);
    render(true);
  } else if (el.dataset.engine) { studio.engine = el.dataset.engine; studio.error = null; render(true); }
  else if (el.dataset.correct) {
    const q = getByPath(studio.draft, el.dataset.correct);
    q.options.forEach((o, n) => { o.correct = n === +el.dataset.id; });
  } else if (el.id === 'fileInput' && el.files.length) { importFiles(el.files); el.value = ''; }
});
['dragover', 'dragenter'].forEach(ev => document.addEventListener(ev, e => {
  const dz = e.target.closest && e.target.closest('#dropzone'); if (!dz) return;
  e.preventDefault(); dz.classList.add('over');
}));
document.addEventListener('dragleave', e => { const dz = e.target.closest && e.target.closest('#dropzone'); if (dz) dz.classList.remove('over'); });
document.addEventListener('drop', e => {
  const dz = e.target.closest && e.target.closest('#dropzone'); if (!dz) return;
  e.preventDefault(); dz.classList.remove('over');
  if (e.dataTransfer.files.length) importFiles(e.dataTransfer.files);
});

/* ----- Actions du studio ----- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a || !me) return;
  const act = a.dataset.act, id = a.dataset.id;
  if (act === 'ai-new') {
    if (dict.on) stopDictation();
    if (!studio.sources.length && !studio.draft) resetStudio(a.dataset.f);
    else if (a.dataset.f && !studio.settings.folders.includes(a.dataset.f)) studio.settings.folders.push(a.dataset.f);
    navigate('ai-studio');
  } else if (act === 'studio-tab') {
    if (dict.on) stopDictation();
    studio.tab = id; render(true);
  } else if (act === 'studio-step') {
    if (dict.on) stopDictation();
    studio.step = +id; studio.error = null; render();
  } else if (act === 'dict-toggle') {
    dict.on ? stopDictation() : startDictation();
  } else if (act === 'dict-add') {
    if (dict.on) stopDictation();
    const text = (($('dictText') || {}).value || studio.dictText).trim();
    if (wordCount(text) < 5) { toast('La dictée est vide ou trop courte.'); return; }
    studio.sources.push({ id: uid('src'), kind: 'voice', name: studio.dictTitle.trim() || `Dictée du ${new Date().toLocaleDateString('fr-FR')} ${new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}`, text, words: wordCount(text) });
    studio.dictText = ''; studio.dictTitle = ''; render(true); toast('Dictée ajoutée aux sources.');
  } else if (act === 'paste-add') {
    const text = studio.pasteText.trim();
    if (wordCount(text) < 5) { toast('Collez un texte d\'au moins quelques phrases.'); return; }
    studio.sources.push({ id: uid('src'), kind: 'paste', name: studio.pasteTitle.trim() || shortTitle(text.split('\n')[0]), text, words: wordCount(text) });
    studio.pasteText = ''; studio.pasteTitle = ''; render(true); toast('Texte ajouté aux sources.');
  } else if (act === 'src-del') {
    studio.sources = studio.sources.filter(s => s.id !== id); render(true);
  } else if (act === 'src-toggle') {
    studio.openSrc = studio.openSrc === id ? null : id; render(true);
  } else if (act === 'imp-dismiss') {
    studio.importing = studio.importing.filter(j => j.id !== id); render(true);
  } else if (act === 'studio-generate') {
    runGeneration();
  } else if (act === 'draft-toggle') {
    const i = +id; studio.openMods.has(i) ? studio.openMods.delete(i) : studio.openMods.add(i); render(true);
  } else if (act === 'draft-del') {
    const keys = id.split('.'), last = keys.pop(), parent = getByPath(studio.draft, keys.join('.'));
    if (Array.isArray(parent)) {
      parent.splice(+last, 1);
      if (keys.length === 1 && keys[0] === 'modules') studio.openMods = new Set([...studio.openMods].filter(x => x !== +last).map(x => x > +last ? x - 1 : x));
      if (keys[keys.length - 1] === 'questions' && !parent.length) setByPath(studio.draft, keys.slice(0, -1).join('.'), null);
    } else parent[last] = null;
    render(true);
  } else if (act === 'studio-publish') {
    publishDraft(id === 'publish');
  }
});

function todoItems() {

    const u = userById(s.user_id), m = moduleOfLesson(byId('exercises', s.exercise_id).lesson_id), old = Date.now() - new Date(s.created_at) > 2 * DAY;
    items.push({ icon: 'check', title: `Corriger l'exercice de ${u.full_name}`, sub: `${m.title} · déposé ${relTime(s.created_at)}`, nav: 'ref-corrections', urgent: old });
  });
  if (canAccompany() || isExpert(me.id)) openQuestions().sort((a, b) => new Date(a.created_at) - new Date(b.created_at)).forEach(c => {

        ${radar.length ? `<div class="card side-card"><div class="side-sec"><div class="side-t">Radar des blocages <span class="faint">${radar.length}</span></div>

  return `<div class="home-v2"><h1 class="home-h">${esc(r.title)}</h1><div class="home-sub">${esc(r.sub || '')}</div>${out.join('')}</div>`;
}

const isAdmin = () => myRoles.includes('admin');
const allConsultants = () => DB.profiles.filter(u => isLearnerU(u.id));
const consultantsInScope = () => isAdmin() ? allConsultants() : consultantsOf(me.id);
const canFollow = uidc => isAdmin() || DB.assignments.some(a => a.referent_id === me.id && a.consultant_id === uidc);
function lastActivity(u) {
  const dates = [
    ...DB.progress.filter(p => p.user_id === u).map(p => p.completed_at || p.started_at),
    ...DB.quiz_attempts.filter(a => a.user_id === u).map(a => a.created_at),
    ...DB.submissions.filter(s => s.user_id === u).map(s => s.created_at),
    ...DB.comments.filter(c => c.author_id === u).map(c => c.created_at),
  ].filter(Boolean).map(d => new Date(d).getTime());
  return dates.length ? new Date(Math.max(...dates)).toISOString() : null;
}
const currentModuleOf = u => { const l = nextLessonFor(u); return l ? moduleOfLesson(l.id) : null; };
/* Radar : signaux de blocage d'un consultant */
function blockers(u) {
  const out = [], now = Date.now();
  enrollmentsOf(u).forEach(en => {
    const p = byId('paths', en.path_id);
    if (new Date(en.due_date) < now && pathStats(u, p.id).pct < 100) out.push({ kind: 'late', sev: 2, label: `En retard sur « ${p.title} »`, sub: `Échéance dépassée depuis ${Math.ceil((now - new Date(en.due_date)) / DAY)} j` });
  });
  DB.quizzes.forEach(q => {
    const at = attemptsOf(u, q.id);
    if (at.length >= 2 && !at.some(a => a.passed)) out.push({ kind: 'quiz', sev: 2, label: `Quiz échoué ${at.length} fois`, sub: moduleOfLesson(q.lesson_id).title });
  });
  DB.submissions.filter(s => s.user_id === u && byId('exercises', s.exercise_id)).forEach(s => {
    const latest = subsOf(u, s.exercise_id)[0];
    if (latest !== s) return;
    const m = moduleOfLesson(byId('exercises', s.exercise_id).lesson_id);
    if (s.status === 'submitted' && now - new Date(s.created_at) > 2 * DAY) out.push({ kind: 'review', sev: 1, label: 'Exercice en attente de correction', sub: `${m.title} · depuis ${Math.floor((now - new Date(s.created_at)) / DAY)} j` });
    if (s.status === 'changes_requested') out.push({ kind: 'fix', sev: 1, label: 'Correction demandée, pas encore reprise', sub: m.title });
  });
  const la = lastActivity(u), st = learnerStats(u);
  if (st.total && st.pct < 100 && (!la || now - new Date(la) > 5 * DAY)) out.push({ kind: 'idle', sev: 1, label: la ? `Inactif depuis ${Math.floor((now - new Date(la)) / DAY)} jours` : 'Pas encore commencé', sub: currentModuleOf(u) ? currentModuleOf(u).title : '' });
  return out.sort((a, b) => b.sev - a.sev);
}
const RADAR_ICON = { late: 'cal', quiz: 'quiz', review: 'check', fix: 'task', idle: 'home' };
function timelineOf(u, limit = 12) {
  const ev = [];
  DB.progress.filter(p => p.user_id === u && p.status === 'completed').forEach(p => { const l = byId('lessons', p.lesson_id); if (l && l.kind === 'content') ev.push({ at: p.completed_at, icon: 'doc', txt: `A validé la leçon « ${l.title} »` }); });
  DB.quiz_attempts.filter(a => a.user_id === u).forEach(a => { const q = byId('quizzes', a.quiz_id); if (q) ev.push({ at: a.created_at, icon: 'quiz', txt: `Quiz « ${moduleOfLesson(q.lesson_id).title} » : ${a.score}% ${a.passed ? '(réussi)' : '(échoué)'}` }); });
  DB.submissions.filter(s => s.user_id === u && byId('exercises', s.exercise_id)).forEach(s => {
    const m = moduleOfLesson(byId('exercises', s.exercise_id).lesson_id);
    ev.push({ at: s.created_at, icon: 'task', txt: `A déposé l'exercice « ${m.title} » (v${s.version})` });
    if (s.reviewed_at) ev.push({ at: s.reviewed_at, icon: 'check', txt: `Exercice « ${m.title} » ${s.status === 'validated' ? 'validé' : 'à corriger'} par ${(userById(s.reviewer_id) || {}).full_name || 'le référent'}` });
  });
  DB.comments.filter(c => c.author_id === u && !c.parent_id).forEach(c => ev.push({ at: c.created_at, icon: 'chat', txt: `A posé une question sur « ${(byId('lessons', c.lesson_id) || {}).title || ''} »` }));
  return ev.filter(x => x.at).sort((a, b) => new Date(b.at) - new Date(a.at)).slice(0, limit);
}
function timelineHtml(u, limit) {
  const ev = timelineOf(u, limit);
  return ev.length ? `<div class="timeline">${ev.map(x => `<div class="tl-item"><span class="tl-ico">${I[x.icon]}</span><div><div>${esc(x.txt)}</div><div class="faint" style="font-size:11px;">${relTime(x.at)}</div></div></div>`).join('')}</div>` : '<div class="muted" style="font-size:12.5px;">Aucune activité.</div>';
}
const pendingReviews = () => DB.submissions.filter(s => s.status === 'submitted' && canFollow(s.user_id) && subsOf(s.user_id, s.exercise_id)[0] === s);
function openQuestions() {
  return DB.comments.filter(c => !c.parent_id && !c.resolved).filter(c => {
    if (isAdmin()) return true;
    const m = moduleOfLesson(c.lesson_id); return m && moduleExperts(m.id).some(u => u.id === me.id);
  });
}
function progressCell(u) {
  const st = learnerStats(u);
  return `<div style="min-width:150px;"><div style="display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:4px;"><span class="muted">${st.modulesDone}/${st.modulesTotal} modules</span><b>${st.pct}%</b></div><div class="pbar${st.pct === 100 ? ' ok' : ''}"><span style="width:${st.pct}%"></span></div></div>`;
}

  const past = d < new Date();

    <div style="flex:1; min-width:0;"><div style="font-weight:600;">${esc(s.title || SESSION_KIND[s.kind])} <span class="badge b-lock">${SESSION_KIND[s.kind]}</span> ${s.done ? '<span class="badge b-done">Fait</span>' : past ? '<span class="badge b-wait">À clôturer</span>' : ''}</div>
      <div class="muted" style="font-size:11.5px;">${esc(fmtDayTime(s.starts_at))} · ${s.duration_min} min</div>

    ${canFollow(s.consultant_id) ? `<div class="row-actions">${!s.done ? `<button class="icon-btn" type="button" title="Marquer comme fait" data-act="session-done" data-id="${s.id}">${OK_SVG}</button>` : ''}<button class="icon-btn" type="button" title="Modifier" data-act="session-edit" data-id="${s.id}">${EDIT_SVG}</button><button class="icon-btn" type="button" title="Supprimer" data-act="session-del" data-id="${s.id}">${X_SVG}</button></div>` : ''}</div>`;
}
const EDIT_SVG = hi('edit');
function renderPlanning() {
  const cs = consultantsInScope().map(u => u.id);
  const ss = DB.sessions.filter(s => cs.includes(s.consultant_id)).sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));

function sessionForm(s, cid) {

/* ----- Actions de suivi ----- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a || !me) return;
  const act = a.dataset.act, id = a.dataset.id;
  if (act === 'qfilter') { qFilter = id; render(true); }
  else if (act === 'session-new' || act === 'session-edit') {
    const s = act === 'session-edit' ? byId('sessions', id) : null;
    openModal(s ? 'Modifier la session' : 'Planifier une session', sessionForm(s, act === 'session-new' ? id : null),
      `<button class="btn secondary" type="button" data-act="modal-close">Annuler</button><button class="btn" type="button" data-act="session-save" data-id="${s ? s.id : ''}">Enregistrer</button>`);
  } else if (act === 'session-save') {
    const data = { consultant_id: $('sCons').value, host_id: $('sHost').value, kind: $('sKind').value, title: $('sTitle').value.trim(), module_id: $('sMod').value || null,
      starts_at: new Date($('sDate').value).toISOString(), duration_min: +$('sDur').value || 30 };
    if (!$('sDate').value) { toast('Choisissez une date.'); return; }
    if (id) Object.assign(byId('sessions', id), data);
    else {
      DB.sessions.push({ id: uid('se'), done: false, ...data });
      notify(data.consultant_id, 'answer', 'Nouvelle session planifiée', `${data.title || SESSION_KIND[data.kind]} avec ${userById(data.host_id).full_name}, ${fmtDayTime(data.starts_at)}`, '#/dashboard');
    }
    closeModal(); render(true); toast('Session enregistrée.');
  } else if (act === 'session-done') { byId('sessions', id).done = true; render(true); }
  else if (act === 'session-del') { DB.sessions = DB.sessions.filter(s => s.id !== id); render(true); toast('Session supprimée.'); }
});

   Administration : vue globale, utilisateurs, édition des cursus

function bars(rows, opts = {}) {
  // rows : [{ label, sub, value (0-100 ou nombre), max }]

async function saveUser(id) {
  const name = $('uName').value.trim(), email = $('uEmail').value.trim().toLowerCase();
  if (!name || !/^\S+@\S+\.\S+$/.test(email)) { toast('Nom et e-mail valide obligatoires.'); return; }

  const roles = [...document.querySelectorAll('input[name="uRole"]:checked')].map(x => x.value);
  const folders = [...document.querySelectorAll('input[name="uFolder"]:checked')].map(x => x.value);
  const refId = $('uRef').value;
  let u = id ? userById(id) : null;
  if (u) Object.assign(u, { full_name: name, email, job_title: $('uJob').value.trim() });
  else if (SB_READY) {
    const btn = document.querySelector('[data-act="user-save"]'); if (btn) btn.disabled = true;
    const { data, error } = await sb.functions.invoke('invite-user', { body: { email, full_name: name, job_title: $('uJob').value.trim(), redirect_to: location.origin + location.pathname } });
    if (error || !data || !data.id) { if (btn) btn.disabled = false; toast('Invitation impossible : ' + ((data && data.error) || (error && error.message) || 'erreur inconnue')); return; }
    u = { id: data.id, email, full_name: name, job_title: $('uJob').value.trim(), avatar_url: null, active: true, created_at: new Date().toISOString() };
    DB.profiles.push(u); snap.profiles.set(u.id, JSON.stringify(cleanRow('profiles', u)));   // le profil existe déjà côté serveur
  }
  else { u = { id: uid('u'), email, full_name: name, job_title: $('uJob').value.trim(), avatar_url: null, active: true }; DB.profiles.push(u); }
  DB.user_roles = DB.user_roles.filter(r => r.user_id !== u.id).concat(roles.map(r => ({ user_id: u.id, role_code: r })));
  const before = foldersOfUser(u.id).map(f => f.id);
  DB.user_folders = DB.user_folders.filter(x => x.user_id !== u.id).concat(folders.map(f => ({ user_id: u.id, folder_id: f })));
  folders.forEach(f => syncFolderEnrollments(f));
  before.filter(f => !folders.includes(f)).forEach(f => pathsOfFolder(f).forEach(p => pruneEnrollments([u.id], p.id)));
  DB.assignments = DB.assignments.filter(a => !(a.consultant_id === u.id && a.is_primary));
  if (refId) DB.assignments.push({ id: uid('as'), consultant_id: u.id, referent_id: refId, is_primary: true });
  closeModal(); render(true); toast(id ? 'Utilisateur mis à jour.' : SB_READY ? `Invitation envoyée à ${email}.` : `Compte créé pour ${name}.`);
}

let le = null;   // copie de travail de la leçon en cours d'édition
function htmlToMd(h) {
  return String(h || '').replace(/\n/g, ' ')
    .replace(/<h[1-3][^>]*>(.*?)<\/h[1-3]>/gi, '\n### $1\n\n').replace(/<h[4-6][^>]*>(.*?)<\/h[4-6]>/gi, '\n#### $1\n\n')
    .replace(/<li[^>]*>(.*?)<\/li>/gi, '- $1\n').replace(/<\/?(ul|ol)[^>]*>/gi, '\n')
    .replace(/<blockquote[^>]*>(.*?)<\/blockquote>/gi, '\n> $1\n\n')
    .replace(/<strong>(.*?)<\/strong>/gi, '**$1**').replace(/<em>(.*?)<\/em>/gi, '*$1*').replace(/<code>(.*?)<\/code>/gi, '`$1`')
    .replace(/<p[^>]*>(.*?)<\/p>/gi, '$1\n\n').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '')
    .replace(/&gt;/g, '>').replace(/&lt;/g, '<').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&')
    .replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
}

  else if (act === 'chap-save') { const t = $('cTitle').value.trim(); if (!t) return; const cid = uid('c'); DB.chapters.push({ id: cid, module_id: id, position: chaptersOfModule(id).length + 1, title: t }); newLesson(cid, 'content', t); closeModal(); render(true); }
  else if (act === 'chap-edit') { const c = byId('chapters', id); openModal('Renommer le chapitre', `<label class="field-label">Titre</label><input class="input" id="cTitle" value="${esc(c.title)}">`, footer('chap-rename', 'Enregistrer', `data-id="${id}"`)); }

/* ----- Fiche d'un cursus ----- */
function cursusStats(pid) {
  const ens = DB.path_enrollments.filter(e => e.path_id === pid), us = ens.map(e => userById(e.user_id)).filter(Boolean);
  const pcts = us.map(u => pathStats(u.id, pid).pct);
  const qids = DB.quizzes.filter(q => moduleOfLesson(q.lesson_id).path_id === pid).map(q => q.id);
  const best = [];
  us.forEach(u => qids.forEach(q => { const at = attemptsOf(u.id, q); if (at.length) best.push(Math.max(...at.map(a => a.score))); }));
  return { users: us, avg: pcts.length ? Math.round(pcts.reduce((a, b) => a + b, 0) / pcts.length) : 0,
           quiz: best.length ? Math.round(best.reduce((a, b) => a + b, 0) / best.length) : null, done: pcts.filter(x => x === 100).length };
}

/* ----- Profil d'apprenant (fiche consultant et « Mon profil ») ----- */
const LEVELS = [[0, 'À découvrir'], [1, 'Novice'], [34, 'Débutant avancé'], [67, 'Compétent'], [100, 'Confirmé']];
const levelOf = v => LEVELS.filter(([t]) => v >= t).pop()[1];
function competencies(u) {
  const mods = enrollmentsOf(u).flatMap(e => modulesOfPath(e.path_id));
  const groups = {};
  mods.forEach(m => { const k = m.tool_id ? byId('tools', m.tool_id).name : 'Méthode Hike UP'; (groups[k] = groups[k] || []).push(m); });
  return Object.entries(groups).map(([name, ms]) => {
    const ls = ms.flatMap(m => lessonsOfModule(m.id));
    const done = ls.filter(l => lessonDone(u, l.id)).length, started = ls.filter(l => progressRec(u, l.id)).length;
    return { name, acq: ls.length ? Math.round(100 * done / ls.length) : 0, prog: ls.length ? Math.round(100 * started / ls.length) : 0 };
  });
}
function radarSvg(comp, size = 320) {
  const n = comp.length; if (n < 3) return '';
  const c = size / 2, R = size / 2 - 70;
  const pt = (i, v) => { const a = -Math.PI / 2 + 2 * Math.PI * i / n; return [c + Math.cos(a) * R * v / 100, c + Math.sin(a) * R * v / 100]; };
  const poly = key => comp.map((x, i) => pt(i, Math.max(x[key], 4)).join(',')).join(' ');
  const rings = [25, 50, 75, 100].map(v => `<polygon points="${comp.map((x, i) => pt(i, v).join(',')).join(' ')}" fill="none" stroke="var(--border)"/>`).join('');
  const axes = comp.map((x, i) => { const [ex, ey] = pt(i, 100), [lx, ly] = pt(i, 122); return `<line x1="${c}" y1="${c}" x2="${ex}" y2="${ey}" stroke="var(--border)"/><text x="${lx}" y="${ly}" text-anchor="${lx < c - 4 ? 'end' : lx > c + 4 ? 'start' : 'middle'}" dominant-baseline="middle">${esc(x.name)}</text>`; }).join('');
  return `<svg class="radar" viewBox="-50 0 ${size + 100} ${size}" role="img" aria-label="Compétences">${rings}${axes}
    <polygon points="${poly('prog')}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-dasharray="3 3" opacity=".9"/>
    <polygon points="${poly('acq')}" fill="rgba(31,122,62,.14)" stroke="var(--ok)" stroke-width="1.5"/></svg>`;
}

function hl(text, q) {
  if (!q) return esc(text);
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  return i < 0 ? esc(text) : esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));

function runSearch() {

const PK = { progress: ['user_id', 'lesson_id'], user_badges: ['user_id', 'module_id'], user_roles: ['user_id', 'role_code'], folder_paths: ['folder_id', 'path_id'], user_folders: ['user_id', 'folder_id'] };
const SYNC_ORDER = ['profiles', 'tools', 'folders', 'paths', 'modules', 'chapters', 'lessons', 'quizzes', 'questions', 'exercises', 'resources', 'folder_paths', 'user_folders',
  'user_roles', 'path_enrollments', 'assignments', 'experts', 'progress', 'submissions', 'comments', 'sessions', 'notifications', 'ai_generations'];

  'user_roles', 'path_enrollments', 'assignments', 'experts', 'ai_generations'];
const keyOf = (t, r) => (PK[t] || ['id']).map(k => r[k]).join('|');
function cleanRow(t, r) { const o = {}; COLS[t].forEach(c => { if (r[c] !== undefined) o[c] = r[c]; }); return o; }
let snap = {}, syncTimer = null, syncing = false, syncAgain = false, pollTimer = null;
function takeSnapshot(tables = Object.keys(COLS)) { tables.forEach(t => { snap[t] = new Map((DB[t] || []).map(r => [keyOf(t, r), JSON.stringify(cleanRow(t, r))])); }); }
async function refreshTables(tables) {
  const res = await Promise.all(tables.map(t => sb.from(t).select('*')));
  res.forEach((r, i) => { if (!r.error) { DB[tables[i]] = r.data || []; takeSnapshot([tables[i]]); } });

async function loadAll(userId) {

function scheduleSync() { if (!SB_READY || !me) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 400); }
async function syncNow() {

  if (syncing) { syncAgain = true; return; }
  syncing = true;
  const admin = isAdmin(), acc = canAccompany(), refresh = new Set(), deletes = [];
  const tables = SYNC_ORDER.filter(t => !(ADMIN_TABLES.includes(t) && !admin) && !(t === 'sessions' && !acc));
  for (const t of tables) {
    const before = snap[t] || new Map(), cur = new Map((DB[t] || []).map(r => [keyOf(t, r), cleanRow(t, r)]));
    const added = [], changed = [];
    cur.forEach((r, k) => { const j = JSON.stringify(r); if (!before.has(k)) added.push(r); else if (before.get(k) !== j) changed.push(r); });
    if (t === 'profiles') added.length = 0;   // un compte se crée par invitation, jamais depuis le navigateur
    let failed = null;
    if (added.length) {

        : PK[t] ? sb.from(t).upsert(added, { onConflict: PK[t].join(','), ignoreDuplicates: false }) : sb.from(t).insert(added);
      const { error } = await q; if (error) failed = error;

    for (const r of changed) {
      if (failed) break;
      let q = sb.from(t).update(r); (PK[t] || ['id']).forEach(k => { q = q.eq(k, r[k]); });
      const { error } = await q; if (error) failed = error;
    }
    if (failed) { toast(`Enregistrement impossible : ${failed.message}`); refresh.add(t); continue; }
    if (added.length || changed.length) {
      [...added, ...changed].forEach(r => before.set(keyOf(t, r), JSON.stringify(r)));
      if (t === 'progress') ['progress', 'user_badges', 'certificates'].forEach(x => refresh.add(x));
      if (['user_folders', 'folder_paths', 'paths', 'path_enrollments'].includes(t)) refresh.add('path_enrollments');
      if (['notifications', 'user_folders', 'folder_paths', 'path_enrollments', 'submissions'].includes(t)) refresh.add('notifications');
    }
    const gone = [...before.keys()].filter(k => !cur.has(k));
    if (gone.length) deletes.push([t, gone, before]);
    snap[t] = before;
  }
  for (const [t, keys, before] of deletes.reverse()) {
    for (const k of keys) {
      const vals = k.split('|'); let q = sb.from(t).delete();
      (PK[t] || ['id']).forEach((c, i) => { q = q.eq(c, vals[i]); });
      const { error } = await q;
      if (error) { toast(`Suppression impossible : ${error.message}`); refresh.add(t); } else before.delete(k);
    }
  }
  if (refresh.size) { await refreshTables([...refresh]); if (me) renderNoSync(); }
  syncing = false;
  if (syncAgain) { syncAgain = false; scheduleSync(); }
}
function renderNoSync() { const t = syncTimer; render(true); clearTimeout(syncTimer); syncTimer = t; }
window.addEventListener('beforeunload', e => { if (syncing || syncTimer) { syncNow(); } });

/* Session : connexion, invitation, mot de passe */
let loginMode = 'login';
function setLoginMode(mode) {
  loginMode = mode;
  const setp = mode === 'setpass';
  $('loginTitle').textContent = setp ? 'Choisissez votre mot de passe' : 'Bienvenue sur votre espace de formation';
  $('loginSub').textContent = setp ? 'Il vous servira à vous reconnecter. 8 caractères minimum.' : 'Connectez-vous pour suivre votre parcours d\'onboarding.';
  ['loginEmail'].forEach(i => { $(i).style.display = setp ? 'none' : ''; $(i).previousElementSibling.style.display = setp ? 'none' : ''; });
  $('loginPassword2').style.display = setp ? '' : 'none'; $('loginPass2Label').style.display = setp ? '' : 'none';
  $('loginForgot').style.display = setp || !SB_READY ? 'none' : '';
  $('loginSubmit').textContent = setp ? 'Enregistrer et entrer' : 'Continuer';
}
async function setPassword() {
  const p1 = $('loginPassword').value, p2 = $('loginPassword2').value, al = $('loginAlert');
  if (p1.length < 8) { al.textContent = '8 caractères minimum.'; al.style.display = 'block'; return; }
  if (p1 !== p2) { al.textContent = 'Les deux mots de passe ne correspondent pas.'; al.style.display = 'block'; return; }
  const { data, error } = await sb.auth.updateUser({ password: p1 });
  if (error) { al.textContent = error.message; al.style.display = 'block'; return; }
  history.replaceState(null, '', location.pathname + location.search);
  $('loginPassword').value = ''; $('loginPassword2').value = ''; setLoginMode('login');
  await sbEnter(data.user);
}
async function forgotPassword() {
  const email = $('loginEmail').value.trim().toLowerCase(), al = $('loginAlert');
  if (!/^\S+@\S+\.\S+$/.test(email)) { al.textContent = 'Indiquez d\'abord votre adresse e-mail.'; al.style.display = 'block'; return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  al.textContent = error ? error.message : 'Si ce compte existe, un e-mail pour choisir un nouveau mot de passe vient d\'être envoyé.';
  al.style.display = 'block';
}
async function sbEnter(user) {
  $('loginSubmit').disabled = true; $('loginSubmit').textContent = 'Chargement…';
  try { await loadAll(user.id); } finally { $('loginSubmit').disabled = false; setLoginMode(loginMode); }
  const prof = DB.profiles.find(p => p.id === user.id);
  if (!prof || prof.active === false) {
    await sb.auth.signOut(); showLogin();
    $('loginAlert').textContent = prof ? 'Ce compte est désactivé.' : 'Profil introuvable : contactez un administrateur.'; $('loginAlert').style.display = 'block';
    return;
  }
  enterApp(prof);
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => { if (!me || syncing || document.hidden) return; await refreshTables(['notifications', 'comments', 'submissions', 'sessions', 'user_badges', 'certificates']); renderNoSync(); if ($('notifDrawer').classList.contains('open')) renderNotifs(); }, 60000);
}
async function sbStart() {
  const invited = /type=(invite|recovery|signup)/.test(location.hash);
  sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') { showLogin(); setLoginMode('setpass'); } });
  const { data: { session } } = await sb.auth.getSession();
  if (session && invited) { showLogin(); setLoginMode('setpass'); return; }
  if (session) await sbEnter(session.user); else showLogin();
}

/* Import du contenu de départ (une seule fois, par un administrateur, sur une base vide) */
async function importStarterContent() {
  const S = SEED_CONTENT, map = {};
  const nid = old => old == null ? null : (map[old] || (map[old] = crypto.randomUUID()));
  S.tools.forEach(t => { const x = DB.tools.find(y => y.slug === t.slug); if (x) map[t.id] = x.id; });
  S.folders.forEach(f => { const x = DB.folders.find(y => y.name === f.name); if (x) map[f.id] = x.id; });
  const rows = {
    tools: S.tools.filter(t => !DB.tools.some(y => y.slug === t.slug)).map(t => ({ id: nid(t.id), slug: t.slug, name: t.name, color: t.color || null })),
    folders: S.folders.filter(f => !DB.folders.some(y => y.name === f.name)).map(f => ({ id: nid(f.id), name: f.name, description: f.description, color: f.color, position: f.position })),
    paths: S.paths.map(p => ({ id: nid(p.id), title: p.title, description: p.description, unlock_mode: p.unlock_mode, published: p.published, source: p.source || 'manual' })),
    modules: S.modules.map(m => ({ id: nid(m.id), path_id: nid(m.path_id), position: m.position, title: m.title, objective: m.objective, est_minutes: m.est_minutes,
      prerequisites: (m.prerequisites || []).map(nid), tool_id: m.tool_id ? nid(m.tool_id) : null, badge_label: m.badge_label || m.title })),
    chapters: S.chapters.map(c => ({ id: nid(c.id), module_id: nid(c.module_id), position: c.position, title: c.title })),
    lessons: S.lessons.map(l => ({ id: nid(l.id), chapter_id: nid(l.chapter_id), position: l.position, title: l.title, kind: l.kind, est_minutes: l.est_minutes, blocks: l.blocks || [] })),
    quizzes: S.quizzes.map(q => ({ id: nid(q.id), lesson_id: nid(q.lesson_id), pass_score: q.pass_score, max_attempts: q.max_attempts })),
    questions: S.questions.map(x => ({ id: nid(x.id), quiz_id: nid(x.quiz_id), position: x.position, prompt: x.prompt, options: x.options, explanation: x.explanation || null })),
    exercises: S.exercises.map(x => ({ id: nid(x.id), lesson_id: nid(x.lesson_id), instructions: x.instructions, submission_type: x.submission_type })),
    resources: S.resources.map(r => ({ id: nid(r.id), kind: r.kind, title: r.title, body: r.body, tool_id: r.tool_id ? nid(r.tool_id) : null, tags: r.tags || [] })),
    folder_paths: S.folder_paths.map(fp => ({ folder_id: nid(fp.folder_id), path_id: nid(fp.path_id), position: fp.position })),
  };
  for (const [t, list] of Object.entries(rows)) {
    for (let i = 0; i < list.length; i += 200) {
      const { error } = await sb.from(t).insert(list.slice(i, i + 200));
      if (error) { toast(`Import interrompu (${t}) : ${error.message}`); await loadAll(me.id); render(true); return; }
    }
  }
  await loadAll(me.id); render(true);
  toast(`${rows.paths.length} cursus, ${rows.lessons.length} leçons et ${rows.resources.length} ressources importés.`);
}
