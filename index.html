  // --- Cursus « Backtracking Trane Rental » (process Snitcher), dans le dossier Consultant
  const BT = {"title": "Backtracking Trane Rental (Snitcher)", "description": "Identifier les entreprises qui visitent les pages Rental de trane.eu, garder celles qui correspondent à l'ICP, puis les enrichir et les contacter. Outil : Snitcher, installé via GTM, un workspace par pays.", "modules": [{"t": "Installer le tracker Snitcher", "o": "Installer Snitcher sur les seules pages Rental d'un pays, via Google Tag Manager, sans faire exploser le coût.", "d": 75, "tool": "gtm", "exi": "Votre référent vous donne un pays et les URLs de ses landing pages Rental. Écrivez la regex du déclencheur GTM sur le modèle suisse, puis listez les réglages de la balise (nom, type, déclencheur unique). Déposez un document ou une capture.", "c": [{"t": "Le backtracking : principe et coût", "min": 10, "blocks": [{"type": "text", "md": "Le backtracking consiste à repérer les entreprises qui visitent les pages Rental de trane.eu, puis à contacter les bonnes.\n\n### Comment ça marche\n1. Une entreprise visite une page Rental du pays.\n2. Snitcher identifie l'entreprise.\n3. L'**ICP Scorecard** lui donne une note, de A+ à D.\n4. Le segment **ICP Rental [pays]** garde les bonnes entreprises, sans concurrents ni entités internes.\n5. On enrichit les contacts, on les importe dans Catch-Up et on lance la campagne."}, {"type": "callout", "tone": "warn", "title": "Maîtriser le coût : jamais « All Pages »", "md": "Snitcher **facture chaque entreprise identifiée**. Le tracker ne tourne que sur les pages Rental du pays, grâce à un déclencheur GTM en expression régulière. Un déclencheur « All Pages » identifierait tous les visiteurs de trane.eu et ferait exploser le compteur."}, {"type": "checklist", "title": "Avant de passer à la suite", "items": ["Je sais expliquer le chemin d'une visite jusqu'à la campagne", "Je sais pourquoi on ne déclenche jamais Snitcher sur « All Pages »"]}]}, {"t": "Créer le workspace Snitcher", "min": 10, "blocks": [{"type": "text", "md": "1. Sur **app.snitcher.com**, cliquer sur la flèche du sélecteur de workspace en haut à gauche, puis **Add New Workspace**. Si Snitcher demande confirmation : « I want a new workspace anyway ».\n2. Nom du workspace : **Trane [pays]** (ex. Trane CH).\n3. Domaine : **trane.eu**, le domaine principal. Jamais l'URL d'une landing page : toutes les pages pays partagent ce domaine."}, {"type": "link", "url": "https://app.snitcher.com", "title": "Ouvrir Snitcher", "caption": "Un workspace par pays"}, {"type": "checklist", "title": "Avant de passer à la suite", "items": ["Je nomme le workspace « Trane [pays] »", "Je saisis le domaine trane.eu, jamais une URL de landing page"]}]}, {"t": "Balise et déclencheur dans GTM", "min": 25, "blocks": [{"type": "text", "md": "1. Dans Snitcher, écran « Install the tracker » : sous « Or install with another tool », cliquer sur **Google Tag Manager**, puis **Copy to clipboard**.\n2. Dans GTM, conteneur **Trane [pays]** : Balises, Nouvelle, type « HTML personnalisé », coller le code. Nom : **Snitcher Tracker**.\n3. Déclencheurs, Nouveau, type « Page vue » : **Page URL · correspond à l'expression régulière** · regex des pages Rental du pays. Nom : **Page View Rental [pays]**.\n4. Dans la balise Snitcher Tracker : **un seul déclencheur**, Page View Rental [pays]. Supprimer « All Pages » s'il est présent."}, {"type": "text", "md": "### Regex des pages Rental : exemple Suisse\nPages : location-ch (FR), vermietung-ch (DE), noleggio-ch (IT). Le **|** veut dire « l'une OU l'autre », le **\\.** indique un vrai point. Pour un autre pays, reprendre la même structure avec les URLs de ses landing pages Rental."}, {"type": "code", "title": "Regex Suisse", "text": "https://trane\\.eu/(location-ch|vermietung-ch|noleggio-ch)\\.html"}, {"type": "callout", "tone": "info", "title": "Pourquoi une regex et pas plusieurs conditions", "md": "Dans un même déclencheur GTM, les conditions sont liées par un **ET** : trois URLs en « commence par » ne peuvent jamais être vraies en même temps. Pour un **OU**, on utilise une expression régulière (recommandé) ou trois déclencheurs séparés attachés à la balise."}, {"type": "checklist", "title": "Avant de passer à la suite", "items": ["La balise Snitcher Tracker est en HTML personnalisé", "Le déclencheur utilise une regex sur Page URL", "« All Pages » n'est pas attaché à la balise"]}]}, {"t": "Publier et confirmer", "min": 10, "blocks": [{"type": "text", "md": "1. GTM : **Envoyer**, nom de version « Ajout Snitcher Tracker », puis **Publier**.\n2. Snitcher : **Confirm installation** en bas de l'écran. Le message « Your tracker is live » confirme l'installation.\n\n**Si la confirmation échoue :** vérifier que le conteneur est bien publié (pas seulement enregistré), ouvrir une page Rental du pays, puis réessayer."}, {"type": "checklist", "title": "Avant de passer à la suite", "items": ["Le conteneur GTM est publié, pas seulement enregistré", "« Your tracker is live » s'affiche dans Snitcher"]}]}], "quiz": [{"prompt": "Pourquoi le tracker Snitcher ne doit-il jamais tourner sur « All Pages » ?", "explanation": "", "options": [{"id": "a", "text": "Snitcher facture chaque entreprise identifiée : le coût exploserait", "correct": true, "feedback": "Exact. On limite le tracker aux pages Rental du pays."}, {"id": "b", "text": "Cela ralentit le site trane.eu", "correct": false, "feedback": "Ce n'est pas la raison : c'est une question de coût."}, {"id": "c", "text": "GTM l'interdit", "correct": false, "feedback": "GTM le permet, mais c'est à proscrire pour le coût."}]}, {"prompt": "Quel domaine saisir à la création du workspace Snitcher ?", "explanation": "", "options": [{"id": "a", "text": "trane.eu", "correct": true, "feedback": "Oui : toutes les pages pays partagent ce domaine."}, {"id": "b", "text": "L'URL de la landing page Rental du pays", "correct": false, "feedback": "Jamais une URL de landing page."}, {"id": "c", "text": "trane.com", "correct": false, "feedback": "Non : le domaine principal du site est trane.eu."}]}, {"prompt": "Dans un même déclencheur GTM, comment sont liées plusieurs conditions ?", "explanation": "", "options": [{"id": "a", "text": "Par un ET", "correct": true, "feedback": "Exact : d'où la regex pour obtenir un OU."}, {"id": "b", "text": "Par un OU", "correct": false, "feedback": "Non, par un ET. Trois URLs « commence par » ne seraient jamais vraies ensemble."}, {"id": "c", "text": "Au choix dans les réglages", "correct": false, "feedback": "Non, toujours par un ET."}]}, {"prompt": "Dans la regex, que signifie « \\. » ?", "explanation": "", "options": [{"id": "a", "text": "Un vrai point", "correct": true, "feedback": "Exact. Sans la barre, le point voudrait dire « n'importe quel caractère »."}, {"id": "b", "text": "N'importe quel caractère", "correct": false, "feedback": "C'est le point seul. Avec la barre, c'est un vrai point."}, {"id": "c", "text": "Une fin de ligne", "correct": false, "feedback": "Non."}]}, {"prompt": "La confirmation de l'installation échoue. Que vérifier en premier ?", "explanation": "", "options": [{"id": "a", "text": "Que le conteneur GTM est publié, pas seulement enregistré", "correct": true, "feedback": "Oui, puis ouvrir une page Rental du pays et réessayer."}, {"id": "b", "text": "Qu'« All Pages » est bien attaché", "correct": false, "feedback": "Surtout pas : « All Pages » ne doit jamais être attaché."}, {"id": "c", "text": "Supprimer le workspace et recommencer", "correct": false, "feedback": "Inutile : vérifiez d'abord la publication."}]}]}, {"t": "Configurer Snitcher", "o": "Exclure concurrents et entités internes, noter les entreprises avec l'ICP Scorecard et créer les segments de travail.", "d": 60, "tool": "snitcher", "exi": "Pour le pays donné par votre référent, rechallengez la liste « Competitors » : concurrents locaux à ajouter, concurrents absents du pays à retirer, avec une ligne de justification pour chacun. Vérifiez aussi la liste « Exclusions » (site MTA du pays). Déposez le lien de votre document.", "c": [{"t": "Les listes d'exclusion", "min": 15, "blocks": [{"type": "text", "md": "**Settings › Prospecting › Lists**, puis **Add List**, un domaine par ligne.\n\n- **Competitors** : concurrents rental et HVAC. Liste à rechallenger pour chaque pays : concurrents locaux à ajouter, concurrents absents du pays à retirer.\n- **Exclusions** : entités TTI, partenaires et agence. Ajouter le site MTA du pays s'il manque (ex. mta-industrial.be)."}, {"type": "code", "title": "Liste « Competitors » (base Suisse)", "text": "aggreko.com\ncoolworldrentals.com\nenerent.ch\nmobilintime.ch\nclima2rent.ch\ndaikin.com\ncarrier.com\njohnsoncontrols.com"}, {"type": "code", "title": "Liste « Exclusions »", "text": "mta-industrial.ch\nmta-industrial.at\nmta-it.com\nal-ko.com\nhike-up.be\ntranetechnologies.com\ntrane.com"}, {"type": "checklist", "title": "Avant de passer à la suite", "items": ["Je rechallenge la liste Competitors pour chaque pays", "Le site MTA du pays est dans Exclusions"]}]}, {"t": "L'ICP Scorecard", "min": 15, "blocks": [{"type": "text", "md": "**Settings › ICP Scorecard** : 3 critères (pays, industries, taille), chacun en **Strong** et **Potential**. Snitcher note ensuite chaque entreprise identifiée de A+ à D.\n\nIndustries et tailles sont identiques pour tous les pays. **Seul le pays change** : code ISO du workspace (CH, AT, BE…)."}, {"type": "table", "rows": [["Critère", "Strong", "Potential"], ["Pays", "Code ISO du workspace (ex. CH)", "Aucun"], ["Industries", "Pharmaceuticals, Biotechnology, Chemicals, Food & Beverages, Food Production, Plastics, Packaging and Containers, Paper & Forest Products, Semiconductors, Electrical/Electronic Manufacturing, Machinery, Mechanical or Industrial Engineering, Mining & Metals, Automotive, Aviation & Aerospace, Defense & Space, Tobacco, Luxury Goods & Jewelry, Utilities", "Hospital & Health Care, Warehousing, Construction, Facilities Services, Research, Higher Education, Recreational Facilities and Services, Real Estate, Hospitality, Retail, Events Services"], ["Taille", "51-200, 201-500, 501-1000, 1001-5000, 5001-10 000, 10 001+", "11-50"]]}, {"type": "checklist", "title": "Avant de passer à la suite", "items": ["Je sais où configurer la Scorecard", "Je sais que seul le pays change d'un workspace à l'autre"]}]}, {"t": "Les segments", "min": 20, "blocks": [{"type": "text", "md": "### ICP Rental [pays] (obligatoire)\n**All Companies**, **Add Filter**, puis 3 conditions liées par un ET :\n- ICP Fit · est dans · **A+, A, B, C**\n- Account List · n'est pas dans · **Competitors**\n- Account List · n'est pas dans · **Exclusions**\n\n**Save Segment**, nom : **ICP Rental [pays]**. C'est la vue à consulter chaque jour et à exporter pour les campagnes.\n\n### Form Submissions [pays] (obligatoire)\nLes entreprises qui ont envoyé un formulaire sur les pages Rental. **Save Segment**, nom : **Form Submissions [pays]**."}, {"type": "text", "md": "### Segments complémentaires (optionnels)"}, {"type": "table", "rows": [["Segment", "Filtre"], ["ICP High Intent [pays]", "Base ICP Rental [pays] + temps sur site supérieur à 5 min OU plus de 5 pages vues"], ["Un segment par langue", "FR, DE, IT… selon l'URL visitée, pour personnaliser l'outreach"]]}, {"type": "checklist", "title": "Checklist de mise en place par pays", "items": ["Workspace Snitcher « Trane [pays] » créé (domaine trane.eu)", "Balise Snitcher Tracker créée dans le conteneur GTM Trane [pays]", "Déclencheur Page View Rental [pays] (regex) attaché, sans « All Pages »", "Conteneur publié et « Your tracker is live » affiché dans Snitcher", "Liste Competitors rechallengée pour le pays, liste Exclusions créée (site MTA du pays ajouté)", "ICP Scorecard configurée avec le pays du workspace", "Segments ICP Rental [pays] et Form Submissions [pays] créés"]}]}], "quiz": [{"prompt": "Que contient la liste « Exclusions » ?", "explanation": "", "options": [{"id": "a", "text": "Les entités TTI, les partenaires et l'agence", "correct": true, "feedback": "Exact, avec le site MTA du pays."}, {"id": "b", "text": "Les concurrents rental et HVAC", "correct": false, "feedback": "Ça, c'est la liste « Competitors »."}, {"id": "c", "text": "Les entreprises notées D", "correct": false, "feedback": "Non : la note D est filtrée par le segment, pas par cette liste."}]}, {"prompt": "À quelle fréquence faut-il revoir la liste « Competitors » ?", "explanation": "", "options": [{"id": "a", "text": "Pour chaque nouveau pays", "correct": true, "feedback": "Oui : concurrents locaux à ajouter, absents à retirer."}, {"id": "b", "text": "Jamais, elle est commune à tous les pays", "correct": false, "feedback": "Non, elle se rechallenge pays par pays."}, {"id": "c", "text": "Une fois par an", "correct": false, "feedback": "Non : à chaque pays."}]}, {"prompt": "Qu'est-ce qui change dans l'ICP Scorecard d'un pays à l'autre ?", "explanation": "", "options": [{"id": "a", "text": "Uniquement le pays (code ISO du workspace)", "correct": true, "feedback": "Exact : industries et tailles restent identiques."}, {"id": "b", "text": "Les industries", "correct": false, "feedback": "Non, elles sont identiques pour tous les pays."}, {"id": "c", "text": "Les tailles", "correct": false, "feedback": "Non, elles sont identiques pour tous les pays."}]}, {"prompt": "Quelles notes ICP Fit garde le segment « ICP Rental [pays] » ?", "explanation": "", "options": [{"id": "a", "text": "A+, A, B et C", "correct": true, "feedback": "Exact, sans Competitors ni Exclusions."}, {"id": "b", "text": "A+ et A uniquement", "correct": false, "feedback": "Non : A+, A, B et C."}, {"id": "c", "text": "Toutes, de A+ à D", "correct": false, "feedback": "Non : D est exclu."}]}, {"prompt": "Une entreprise de 11 à 50 salariés est classée…", "explanation": "", "options": [{"id": "a", "text": "Potential", "correct": true, "feedback": "Exact : Strong commence à 51-200."}, {"id": "b", "text": "Strong", "correct": false, "feedback": "Non : Strong commence à 51 salariés."}, {"id": "c", "text": "Exclue", "correct": false, "feedback": "Non, elle reste en Potential."}]}]}, {"t": "Traiter les leads et lancer la campagne", "o": "À chaque vague : exporter le segment, enrichir sans crédit Clay, rédiger les paragraphes, trouver les emails et lancer la campagne dans Catch-Up.", "d": 120, "tool": "snitcher", "exi": "Traitez une vague complète sur le workspace indiqué par votre référent : export du segment, prompt 1, prompt 2, emails FullEnrich, import dans Catch-Up (sans lancer l'envoi). Déposez le lien de la DB finale et le récap produit par Claude.", "c": [{"t": "Exporter le segment depuis Snitcher", "min": 15, "blocks": [{"type": "text", "md": "1. Workspace du pays, segment **ICP Rental [pays]**.\n2. Parcourir les entreprises et **retirer les faux positifs évidents**.\n3. **Export** (en haut à droite), **All columns**, **CSV**.\n\nLe fichier contient : entreprise, domaine, industrie, taille, localisation, pages visitées, temps passé, sessions, score ICP."}, {"type": "checklist", "title": "Avant de passer à la suite", "items": ["J'exporte en « All columns » au format CSV", "J'ai retiré les faux positifs évidents"]}]}, {"t": "Enrichir la base avec Claude (prompt 1)", "min": 25, "blocks": [{"type": "text", "md": "Coller le prompt 1 dans Claude, remplacer **[PAYS]** et joindre le CSV. Claude nettoie la base, trouve tous les contacts pertinents pour Trane Rental dans chaque entreprise (Clay en recherche uniquement + web) et ajoute les colonnes habituelles."}, {"type": "callout", "tone": "warn", "title": "Règle absolue : zéro crédit Clay", "md": "Interdit dans Clay : colonne d'enrichissement, Claygent, colonne IA, waterfall. Si un outil annonce un coût, on s'arrête et on demande. Les emails ne se cherchent pas à cette étape : ils passent ensuite dans FullEnrich."}, {"type": "code", "title": "Prompt 1 · enrichir l'export Snitcher", "text": "On enrichit l'export Snitcher du segment ICP Rental [PAYS] (CSV joint) pour une campagne Trane Rental. Règle absolue : zéro crédit Clay.\n\n1. NETTOYAGE\n- Supprimer les doublons.\n- Retirer les entreprises non pertinentes qui auraient passé les filtres (concurrents, entités TTI, partenaires, agences, sociétés sans site dans le pays). Les lister à part avec le motif.\n\n2. CONTACTS (tous les contacts pertinents pour Trane Rental dans chaque entreprise)\nProfils : Facility Manager, Plant Manager, Maintenance Manager, Energy Manager, Directeur de site, Responsable technique.\nPersonas TTI : Production & Site, Maintenance & Technique, Facility & Énergie. Direction / PME si le site n'a pas de fonction dédiée.\nContacts basés dans le pays uniquement.\nSources : Clay Find People (recherche uniquement) + web (LinkedIn, site de l'entreprise, page légale).\nInterdit dans Clay : colonne d'enrichissement, Claygent, colonne IA, waterfall. Si un outil annonce un coût, tu t'arrêtes et tu me demandes.\nEmails : tu ne les cherches pas, je les passe dans FullEnrich après.\n\n3. FICHIER À LIVRER (Excel, 1 ligne = 1 contact)\nGarder les colonnes Snitcher (entreprise, domaine, industrie, taille, localisation, pages visitées, temps passé, sessions, score ICP) et ajouter :\nPrénom | Nom | Salutation | Job Title | Persona | Langue | LinkedIn | Email (vide) | Paragraphe 1 (vide) | Source (Clay / web)\nCleaning : casse propre, Prénom / Nom dans la bonne colonne, Salutation Mister ou Miss, persona normalisé, URL en texte simple.\nLangue du contact écrite en français : français, allemand, néerlandais, italien, anglais.\nOnglet séparé : entreprises sans contact trouvé.\nEn fin de travail : un récap (entreprises gardées / retirées, contacts par persona, trous éventuels)."}, {"type": "checklist", "title": "Avant de passer à la suite", "items": ["J'ai remplacé [PAYS] et joint le CSV", "Le fichier livré contient un onglet « entreprises sans contact » et un récap"]}]}, {"t": "Rédiger les paragraphes 1 (prompt 2)", "min": 25, "blocks": [{"type": "text", "md": "Coller le prompt 2 avec le fichier enrichi. Un paragraphe unique par contact, dans sa langue. **Vérifier**, puis garder le résultat dans la colonne **Paragraphe 1**."}, {"type": "callout", "tone": "warn", "title": "À ne jamais faire", "md": "Mentionner que l'on a vu la visite de l'entreprise sur le site. Le paragraphe parle de la réalité de l'entreprise, pas de son comportement en ligne."}, {"type": "code", "title": "Prompt 2 · rédiger les paragraphes 1", "text": "Pour chaque contact du fichier joint, rédige le Paragraphe 1 d'un email de prospection Trane Rental et mets-le dans la colonne Paragraphe 1.\n\nRÈGLES\n- 2 à 3 phrases maximum.\n- Montrer qu'on comprend la réalité de l'entreprise, sans jamais mentionner qu'on a vu sa visite sur le site.\n- Nommer l'entreprise et, si possible, le site de production ou la localisation.\n- Ouvrir sur un pain point concret lié à son secteur et à un besoin probable de refroidissement ou de chauffage temporaire (maintenance planifiée, pic saisonnier, urgence, travaux, extension).\n- Si on a une info spécifique (actualité, projet, incident, extension), l'utiliser comme accroche.\n- Ton professionnel, direct, humain. Pas de formules type « je me permets de vous contacter ». Pas de longs tirets.\n- Langue : selon la colonne Langue du contact.\n- Le paragraphe suivant de l'email présente déjà l'offre Rental : ne pas la répéter ici.\n\nÀ UTILISER POUR CHAQUE CONTACT\nNom de l'entreprise, secteur, pages visitées sur trane.eu, taille, localisation, et toute info publique pertinente (recherche web)."}, {"type": "checklist", "title": "Avant de passer à la suite", "items": ["Aucun paragraphe ne mentionne la visite sur le site", "J'ai relu les paragraphes avant de les garder"]}]}, {"t": "Trouver les emails avec FullEnrich", "min": 20, "blocks": [{"type": "text", "md": "1. Exporter **Prénom, Nom, Entreprise, Domaine, LinkedIn URL** vers FullEnrich.\n2. Intégrer les emails trouvés dans la colonne **Email** de la DB."}, {"type": "table", "rows": [["Statut FullEnrich", "Décision"], ["valid", "Garder"], ["probably valid", "Garder"], ["catch-all", "Au cas par cas"], ["invalid", "Écarter"]]}, {"type": "checklist", "title": "Avant de passer à la suite", "items": ["Les « invalid » sont écartés", "Les « catch-all » ont été traités au cas par cas"]}]}, {"t": "Importer dans Catch-Up et lancer", "min": 20, "blocks": [{"type": "text", "md": "1. Importer la DB finalisée (emails + paragraphes 1) dans **Catch-Up**.\n2. Créer ou sélectionner la campagne **« Snitcher Rental [pays] »** avec le scénario dans la bonne langue.\n3. Mapper **{{last_name}}** et **{{paragraph_1}}** sur les colonnes de la DB, puis pousser les contacts sur la campagne.\n\nL'email ci-dessous est à copier dans Catch-Up, puis à traduire dans la langue du scénario. Signature : l'expéditeur du pays (Elena en Suisse, Camille en Belgique…)."}, {"type": "code", "title": "Email 1 · campagne Snitcher Rental (EN)", "text": "Dear Mr./Ms. {{last_name}},\n\n{{paragraph_1}}\n\nTrane Rental provides chillers and heat pumps from 5 kW to 2 MW, delivered and connected on site within 24 hours, maintenance included.\n\nIf this is of interest, let me know.\n\nBest regards,\n\n[Sender]"}, {"type": "checklist", "title": "Checklist par vague", "items": ["Segment ICP Rental [pays] vérifié et exporté (All columns, CSV)", "DB enrichie : nettoyage, contacts, colonnes habituelles", "Paragraphes 1 rédigés et relus", "Emails FullEnrich intégrés, « invalid » écartés", "Contacts poussés sur la campagne « Snitcher Rental [pays] »"]}]}], "quiz": [{"prompt": "Comment exporter le segment depuis Snitcher ?", "explanation": "", "options": [{"id": "a", "text": "Export, All columns, CSV", "correct": true, "feedback": "Exact."}, {"id": "b", "text": "Export des seules colonnes entreprise et domaine", "correct": false, "feedback": "Non : All columns, pour garder pages visitées, temps passé, score ICP…"}, {"id": "c", "text": "Copier-coller la vue à l'écran", "correct": false, "feedback": "Non : Export, All columns, CSV."}]}, {"prompt": "Pendant l'enrichissement avec Claude, que peut-on utiliser dans Clay ?", "explanation": "", "options": [{"id": "a", "text": "La recherche uniquement (Find People)", "correct": true, "feedback": "Exact : zéro crédit Clay."}, {"id": "b", "text": "Une waterfall pour les emails", "correct": false, "feedback": "Interdit, comme les colonnes d'enrichissement, Claygent et les colonnes IA."}, {"id": "c", "text": "Claygent pour la recherche web", "correct": false, "feedback": "Interdit : Claygent consomme des crédits."}]}, {"prompt": "Que ne doit JAMAIS contenir le Paragraphe 1 ?", "explanation": "", "options": [{"id": "a", "text": "Une mention de la visite sur le site", "correct": true, "feedback": "Exact."}, {"id": "b", "text": "Le nom de l'entreprise", "correct": false, "feedback": "Au contraire, on nomme l'entreprise."}, {"id": "c", "text": "Un pain point lié au secteur", "correct": false, "feedback": "Au contraire, on ouvre sur un pain point concret."}]}, {"prompt": "Quels statuts FullEnrich garde-t-on ?", "explanation": "", "options": [{"id": "a", "text": "« valid » et « probably valid »", "correct": true, "feedback": "Exact : « catch-all » au cas par cas, « invalid » écartés."}, {"id": "b", "text": "Tous sauf « invalid »", "correct": false, "feedback": "Non : les « catch-all » se traitent au cas par cas."}, {"id": "c", "text": "« valid » uniquement", "correct": false, "feedback": "Non : on garde aussi « probably valid »."}]}, {"prompt": "Quelles variables faut-il mapper dans Catch-Up ?", "explanation": "", "options": [{"id": "a", "text": "{{last_name}} et {{paragraph_1}}", "correct": true, "feedback": "Exact."}, {"id": "b", "text": "{{first_name}} et {{company}}", "correct": false, "feedback": "Non : l'email utilise {{last_name}} et {{paragraph_1}}."}, {"id": "c", "text": "Aucune, Catch-Up les détecte seul", "correct": false, "feedback": "Non : il faut les mapper sur les colonnes de la DB."}]}, {"prompt": "Comment s'appelle la campagne dans Catch-Up ?", "explanation": "", "options": [{"id": "a", "text": "Snitcher Rental [pays]", "correct": true, "feedback": "Exact, avec le scénario dans la bonne langue."}, {"id": "b", "text": "ICP Rental [pays]", "correct": false, "feedback": "Ça, c'est le nom du segment Snitcher."}, {"id": "c", "text": "Backtracking Trane", "correct": false, "feedback": "Non : « Snitcher Rental [pays] »."}]}]}]};

i-pays avec un playbook réservé à son équipe). Si vous n'êtes pas sur le projet, vous accédez seulement aux campagnes partagées dans la bibliothèque."}]], ["Le cycle d'une mission", 20, [{"type": "text", "md": "Une mission suit toujours la même boucle, quel que soit le client :"}, {"type": "table", "rows": [["Étape", "Ce qu'on produit"], ["1. Kick-off", "Les infos clés du client, la roadmap et le plan d'actions"], ["2. Ciblage", "ICP, segments, personas, exclusions, TAM"], ["3. Data sourcing", "Base d'entreprises scorée puis contacts décideurs"], ["4. Campagnes", "Séquences email, brief de calling, landing page, Google Ads"], ["5. Suivi", "Réponses traitées, opportunités créées dans Catch Up"], ["6. Reporting", "Rapport hebdo ou mensuel, ajustements, nouvelles campagnes"]]}, {"type": "text", "md": "Une base n'est **jamais finie** : on la complète (nouveau pays, nouveaux signaux) et on la nettoie à chaque campagne. Un planning sur 12 mois aide à séquencer les produits et les segments du client."}]], ["Démarrer un client : le kick-off", 20, [{"type": "text", "md": "Le kick-off sert à obtenir les informations sans lesquelles aucune campagne ne marche. On parle de **roadmap et de plan d'actions**, pas d'audit."}, {"type": "checklist", "title": "Infos à obtenir au kick-off", "items": ["Le process de vente du client : qui reçoit les opportunités, qui fait les RDV, en quelle langue", "Le funnel de conversion : du premier contact à la signature, où ça bloque", "Le ciblage : segments, zones, taille minimale, TAM estimé", "Les exclusions : clients actuels, concurrents, contacts déjà sollicités", "Les produits à pousser (et ceux dont on ne parle pas), avec leurs noms exacts", "Les références clients citables et ce qu'on peut en dire", "Le paramétrage Catch Up : comptes, adresses d'envoi, champs, formulaires"]}, {"type": "callout", "tone": "warn", "title": "Bon réflexe", "md": "Faites valider par écrit les noms de produits et les références. Un client peut tenir à un vocabulaire précis (ex. « amortisseur » et pas un sigle interne), ou refuser qu'on dise pour quel produit une référence travaille avec lui."}]]], "quiz": [{"prompt": "Un client vous demande « combien d'emails allez-vous envoyer ce mois-ci ? ». Sur quoi recentrez-vous l'échange ?", "explanation": "On parle résultats (opportunités), pas activité.", "options": [{"id": "a", "text": "Le nombre d'opportunités qualifiées visées", "correct": true, "feedback": "C'est l'objectif de la mission : des opportunités que le client peut convertir."}, {"id": "b", "text": "Le volume d'emails, pour le rassurer", "correct": false, "feedback": "Le volume est un moyen, pas un résultat."}, {"id": "c", "text": "La taille de la base livrée", "correct": false, "feedback": "Une grosse base mal qualifiée ne crée pas d'opportunités."}]}, {"prompt": "Au kick-off, quel livrable présentez-vous au client ?", "explanation": "", "options": [{"id": "a", "text": "Une roadmap et un plan d'actions", "correct": true, "feedback": "On construit la suite avec lui, on ne le juge pas."}, {"id": "b", "text": "Un audit de son organisation commerciale", "correct": false, "feedback": "Le mot « audit » met le client sur la défensive et ce n'est pas l'objet."}, {"id": "c", "text": "Une première séquence d'emails", "correct": false, "feedback": "Trop tôt : le ciblage n'est pas encore validé."}]}, {"prompt": "Vous ne trouvez pas le numéro de TVA d'une société. Que mettez-vous dans la colonne ?", "explanation": "", "options": [{"id": "a", "text": "« non trouvé »", "correct": true, "feedback": "Le client sait que la recherche a été faite et peut compléter."}, {"id": "b", "text": "Le numéro d'une société au nom proche", "correct": false, "feedback": "C'est une donnée inventée : à proscrire."}, {"id": "c", "text": "Rien, la cellule reste vide", "correct": false, "feedback": "Une cellule vide ne dit pas si on a cherché."}]}, {"prompt": "Parmi ces informations, laquelle n'est PAS prioritaire au kick-off ?", "explanation": "", "options": [{"id": "a", "text": "La charte graphique de ses réseaux sociaux", "correct": true, "feedback": "Utile plus tard pour une landing page, pas pour démarrer."}, {"id": "b", "text": "Les clients actuels à exclure", "correct": false, "feedback": "Indispensable pour ne pas prospecter ses propres clients."}, {"id": "c", "text": "Le process de vente et qui reçoit les opportunités", "correct": false, "feedback": "Sans ça, une opportunité créée ne sera pas traitée."}]}]}, {"id": "cm2", "t": "Ciblage, ICP et personas", "o": "Définir qui viser : segments, critères de taille, décideurs et exclusions, avant de sourcer la moindre donnée.", "tool": null, "c": [["ICP, segments et TAM", 20, [{"type": "text", "md": "L'**ICP** (Ideal Customer Profile) décrit l'entreprise idéale pour le client. On le découpe en **segments** (familles d'entreprises qui ont le même besoin et qu'on peut adresser avec le même message), puis on estime le **TAM** (le nombre d'entreprises adressables)."}, {"type": "table", "rows": [["Critère", "Exemples"], ["Secteur", "Code NACE (ex. 71.12 bureaux d'études, 71.11 architectes), activité réelle vérifiée sur le site"], ["Zone", "Région, province, pays ; parfois une seule région (ex. Hauts-de-France)"], ["Taille", "CA, effectif, ou un critère métier : taille du bâtiment pour du photovoltaïque, nombre de machines produites par an"], ["Pouvoir de décision", "Le site local décide-t-il ? Une filiale sans décision locale est écartée"], ["Lieu", "Le site de production, pas le siège du groupe, quand l'offre concerne l'usine"]]}, {"type": "callout", "tone": "info", "title": "Retenir", "md": "La taille utile dépend de l'offre. Pour une installation photovoltaïque, la surface du bâtiment compte plus que le nombre d'employés."}]], ["Personas et décideurs", 20, [{"type": "text", "md": "Les **personas** sont les fonctions à contacter dans chaque entreprise. On les classe **par ordre de priorité** et on ne garde que des personnes qui ont au moins un petit pouvoir de décision."}, {"type": "table", "rows": [["Bon réflexe", "Pourquoi"], ["Ordonner les personas (ex. 1. achats techniques, 2. maintenance, 3. technique, 4. production, 5. direction en PME)", "Find People et le calling suivent cet ordre"], ["Limiter à 3 à 5 contacts par entreprise", "On vise les meilleurs profils, pas tout l'organigramme"], ["Chercher les intitulés exacts en FR, EN et NL", "Les titres varient selon la région et la langue"], ["Exclure les non-décideurs", "Assistants, stagiaires, contrôleurs, comptables, fonctions hors sujet"]]}, {"type": "callout", "tone": "info", "title": "Exemple", "md": "Pour une offre de stockage d'énergie : dirigeants, directeurs financiers décideurs (pas de contrôleurs), responsables techniques, énergie ou maintenance. Les plant managers ou le sourcing non technique peuvent être hors cible selon le client : c'est lui qui tranche."}]], ["Les exclusions", 15, [{"type": "text", "md": "Une base propre commence par ce qu'on **retire** :"}, {"type": "checklist", "title": "À exclure systématiquement", "items": ["Les clients actuels du client (bons de commande, listes clients)", "Ses concurrents", "Les entreprises et contacts déjà sollicités par Hike UP pour ce client", "Les organismes publics et les adresses à l'étranger quand la cible est locale", "Les secteurs refusés par le client (ex. la défense pour certains)", "Les entreprises déjà rencontrées par le client"]}, {"type": "callout", "tone": "warn", "title": "Piège fréquent", "md": "Un même groupe peut apparaître sous plusieurs noms ou plusieurs sites. Dédoublonnez par numéro de TVA et par nom de domaine, pas seulement par nom."}]]], "quiz": [{"prompt": "Vous ciblez des entreprises pour une installation photovoltaïque. Quel critère de taille privilégiez-vous ?", "explanation": "", "options": [{"id": "a", "text": "La surface du bâtiment", "correct": true, "feedback": "C'est elle qui détermine la taille du projet."}, {"id": "b", "text": "Le nombre d'employés seul", "correct": false, "feedback": "Il aide, mais une PME peut avoir un très grand bâtiment."}, {"id": "c", "text": "Le chiffre d'affaires du groupe", "correct": false, "feedback": "Le groupe peut être énorme et le site local tout petit."}]}, {"prompt": "Un grand groupe étranger a une filiale de distribution en Belgique, sans production ni décision locale. Que faites-vous ?", "explanation": "", "options": [{"id": "a", "text": "Vous l'écartez", "correct": true, "feedback": "Sans pouvoir de décision local, le message n'arrivera pas au bon endroit."}, {"id": "b", "text": "Vous la gardez, c'est une grande entreprise", "correct": false, "feedback": "La taille ne compense pas l'absence de décision locale."}, {"id": "c", "text": "Vous contactez tous ses employés", "correct": false, "feedback": "On vise 3 à 5 décideurs, pas tout l'organigramme."}]}, {"prompt": "Combien de contacts vise-t-on en général par entreprise ?", "explanation": "", "options": [{"id": "a", "text": "3 à 5, les meilleures personas", "correct": true, "feedback": "Assez pour toucher le bon décideur, pas au point de saturer la société."}, {"id": "b", "text": "Tous ceux qu'on trouve", "correct": false, "feedback": "On abîme la relation et on gaspille de la capacité d'envoi."}, {"id": "c", "text": "Un seul, toujours le CEO", "correct": false, "feedback": "Le CEO n'est souvent pas le bon interlocuteur technique."}]}, {"prompt": "Deux lignes « Dupont SA » et « Dupont Industries » ont la même TVA. Que faites-vous ?", "explanation": "", "options": [{"id": "a", "text": "Vous les fusionnez : c'est la même société", "correct": true, "feedback": "Le dédoublonnage se fait par TVA et nom de domaine."}, {"id": "b", "text": "Vous gardez les deux, les noms diffèrent", "correct": false, "feedback": "Le prospect recevrait deux fois le même message."}, {"id": "c", "text": "Vous supprimez les deux", "correct": false, "feedback": "On perd une cible valable."}]}]}, {"id": "cm3", "t": "Data sourcing et qualification", "o": "Construire une base fiable étape par étape : sociétés, scoring, contacts, export propre, sans dépense non validée.", "tool": "t_clay", "c": [["La méthode en 6 étapes", 20, [{"type": "text", "md": "On avance **étape par étape**, avec une validation entre chaque étape (référent ou client). On ne lance pas la recherche de contacts tant que la liste d'entreprises n'est pas validée."}, {"type": "table", "rows": [["Étape", "Outil", "Validation"], ["1. Segmentation", "Brief client, NACE", "Segments et zones validés"], ["2. Sociétés", "Clay Find Company, Bizzy, web", "Échantillon validé"], ["3. Scoring 1 à 5", "Vérification du site web", "On garde 4 et 5 (parfois 3)"], ["4. Personas", "Liste d'intitulés FR/EN/NL", "Ordre des personas validé"], ["5. Contacts", "Clay Find People", "Lot de 20 relu"], ["6. Export", "Excel ou CSV point-virgule", "Colonnes au format attendu"]]}, {"type": "callout", "tone": "info", "title": "Travailler par lots", "md": "Un premier lot de 20 entreprises ou contacts, relu et validé, évite de refaire 500 lignes parce que le critère était mal compris."}]], ["Qualifier une entreprise", 20, [{"type": "text", "md": "La description d'une base (Bizzy, Clay) ne suffit pas : on **vérifie le site web** de la société pour confirmer ce qu'elle fait vraiment.\n\nPour chaque société, on note en une phrase **pourquoi elle répond aux critères**. C'est cette phrase qui servira plus tard à personnaliser l'email."}, {"type": "table", "rows": [["Score", "Signification"], ["5", "Cœur de cible, besoin évident"], ["4", "Bonne cible, besoin probable"], ["3", "À confirmer, à garder si la base est courte"], ["2", "Peu probable"], ["1", "Hors cible (distributeur, concurrent, trop petit, pas de site de production)"]]}, {"type": "callout", "tone": "warn", "title": "Cas limites", "md": "Une société au code NACE pertinent mais sans information en ligne peut être gardée par défaut, sauf bonne raison de la retirer. Notez-le pour que le client puisse trancher."}]], ["Les colonnes attendues", 15, [{"type": "text", "md": "Sauf demande contraire du client, une base livrée suit ce format :"}, {"type": "table", "rows": [["Niveau", "Colonnes"], ["Société", "Nom, TVA (très important), NACE, activité en 2-3 mots, description, site web en nom de domaine, LinkedIn société, adresse"], ["Contact", "Civilité (Madame/Monsieur), prénom, nom (séparés), fonction, langue FR/NL, email, mobile, LinkedIn personnel, localisation"], ["Campagne", "Secteur au libellé exact du CRM, tags de personnalisation, score"]]}, {"type": "callout", "tone": "warn", "title": "Fichiers fournis par le client", "md": "Ne jamais supprimer, renommer ou réorganiser ses colonnes ou ses onglets. On ajoute nos résultats en fin de tableau et on garde l'original intact."}]], ["Coûts et outils : les règles", 15, [{"type": "checklist", "title": "Règles de dépense", "items": ["Clay : recherche de sociétés et de contacts autorisée ; enrichissements payants (email, mobile, data points) uniquement avec accord explicite", "Relever l'usage Clay au démarrage, après un premier petit lot et à la fin ; arrêter et alerter en cas de hausse", "Snitcher sert à repérer les sociétés qui visitent un site, pas à trouver des contacts ou des emails", "Recherche web et pages publiques (BCE, sites, LinkedIn public) : toujours gratuites, à privilégier pour les petites listes", "Un navigateur partagé n'est jamais celui d'un collègue : vérifier lequel est connecté avant d'agir"]}]]], "quiz": [{"prompt": "La description Bizzy dit « fabrication de machines », mais le site montre surtout de la revente. Quel score ?", "explanation": "", "options": [{"id": "a", "text": "Un score bas : c'est un distributeur", "correct": true, "feedback": "Le site web fait foi, pas la description de la base."}, {"id": "b", "text": "5, la description le confirme", "correct": false, "feedback": "La description d'une base peut être fausse ou datée."}, {"id": "c", "text": "On ne score pas, on passe à la suivante", "correct": false, "feedback": "Il faut trancher et noter pourquoi."}]}, {"prompt": "Votre première recherche de contacts est prête. Que faites-vous avant de lancer le reste ?", "explanation": "", "options": [{"id": "a", "text": "Faire relire un lot de 20", "correct": true, "feedback": "On vérifie que les critères sont bien compris avant d'en faire 500."}, {"id": "b", "text": "Lancer tout de suite la recherche complète", "correct": false, "feedback": "Si le critère est faux, tout est à refaire."}, {"id": "c", "text": "Lancer l'enrichissement des emails", "correct": false, "feedback": "Payant et prématuré sans validation."}]}, {"prompt": "Vous pensez qu'un enrichissement d'emails ferait gagner du temps. Que faites-vous ?", "explanation": "", "options": [{"id": "a", "text": "Vous demandez un accord explicite avant", "correct": true, "feedback": "Aucune dépense de crédits sans accord."}, {"id": "b", "text": "Vous le lancez sur un petit lot pour tester", "correct": false, "feedback": "Même un petit lot consomme des crédits."}, {"id": "c", "text": "Vous le lancez, c'est inclus", "correct": false, "feedback": "Ce n'est pas inclus : ce sont des crédits payants."}]}, {"prompt": "Le client vous envoie son fichier avec des colonnes mal nommées. Que faites-vous ?", "explanation": "", "options": [{"id": "a", "text": "Vous ajoutez vos colonnes à la fin sans toucher aux siennes", "correct": true, "feedback": "Son fichier reste utilisable par ses outils."}, {"id": "b", "text": "Vous renommez ses colonnes pour plus de clarté", "correct": false, "feedback": "Ses imports ou ses formules peuvent casser."}, {"id": "c", "text": "Vous recréez un fichier propre", "correct": false, "feedback": "Il perd ses repères et son historique."}]}], "ex": "Constituez un **lot test de 20 entreprises** pour un segment de votre choix (ex. fabricants de machines en Wallonie) : nom, TVA, NACE, site web en nom de domaine, adresse, score 1 à 5 et une phrase « pourquoi cette société répond aux critères ». Déposez le fichier ou son lien."}, {"id": "cm4", "t": "Les signaux d'achat (triggers)", "o": "Trouver les entreprises qui ont une raison d'acheter maintenant, et s'en servir comme motif de contact.", "tool": null, "c": [["Pourquoi les signaux", 15, [{"type": "text", "md": "Une campagne basée sur un **signal d'achat** contacte une entreprise au bon moment, avec une raison précise. Le signal devient la première phrase de l'email : on montre qu'on a compris sa situation.\n\nObjectif : identifier les sociétés susceptibles d'acheter **dans les 3 à 12 mois**."}]], ["Le catalogue des signaux", 25, [{"type": "table", "rows": [["Signal", "Où le trouver", "Exemple d'usage"], ["Permis d'urbanisme, d'environnement ou unique", "Registres régionaux, listes de permis", "Projet PV, batterie, HVAC : contacter avant que les marques soient fixées dans le cahier des charges"], ["Offres d'emploi", "Sites carrière, LinkedIn", "Recrutement R&D, maintenance, hydraulique : besoin de renfort ou de sous-traitance"], ["Nouveau poste (new hire)", "Clay, Sales Navigator", "Un nouveau responsable revoit ses fournisseurs"], ["Visites du site web", "Snitcher, backtracking", "Une entreprise consulte la page d'une offre précise"], ["Installations anciennes", "Registres (ex. PV de plus de 10 ans)", "Remplacement, repowering, ajout de batterie"], ["Investissement, expansion", "Presse, actualité", "Nouvelle usine, extension, nouveau zoning"], ["Salons professionnels", "Listes d'exposants", "Prendre RDV avant ou pendant le salon"], ["Open innovation", "Projets européens (CORDIS), brevets", "Entrer dans un projet dès la conception"], ["Saisonnalité", "Calendrier du secteur", "Pic de demande de froid de mai à août, saison des patinoires"], ["Anciens clients d'un partenaire", "Liste fournie par le client", "Reprendre contact sur un projet passé"]]}, {"type": "callout", "tone": "warn", "title": "Règle", "md": "Le signal doit être vérifiable. Si on n'est pas sûr qu'il concerne bien l'entreprise (bon site, bon projet), on ne l'utilise pas comme accroche."}]], ["Transformer un signal en message", 15, [{"type": "text", "md": "Chaque email s'appuie sur **l'entreprise et le motif du signal** (ex. le résumé du permis). On adapte l'offre au signal : pour un nouveau bâtiment, un angle énergétique global ; pour un bâtiment existant, plutôt le stockage ou l'optimisation."}, {"type": "code", "title": "Exemple de première phrase", "text": "J'ai vu que {{Entreprise}} a déposé une demande de permis pour {{Objet du permis}} à {{Commune}}. À ce stade, le choix des équipements n'est souvent pas encore figé, c'est le bon moment pour en parler."}]]], "quiz": [{"prompt": "Une entreprise a déposé un permis pour une extension de bâtiment. Quand la contacter ?", "explanation": "", "options": [{"id": "a", "text": "Maintenant, avant que les équipements soient fixés dans le cahier des charges", "correct": true, "feedback": "Après, les marques sont choisies et il est trop tard."}, {"id": "b", "text": "Après la fin du chantier", "correct": false, "feedback": "Le choix est fait depuis longtemps."}, {"id": "c", "text": "Seulement si elle nous contacte", "correct": false, "feedback": "On perd l'avantage du signal."}]}, {"prompt": "Snitcher vous indique qu'une société a consulté la page d'une offre. Qu'en faites-vous ?", "explanation": "", "options": [{"id": "a", "text": "Un motif de contact lié à l'offre consultée", "correct": true, "feedback": "C'est le principe du backtracking."}, {"id": "b", "text": "Vous cherchez les emails des visiteurs dans Snitcher", "correct": false, "feedback": "Snitcher n'est pas un outil de recherche de contacts."}, {"id": "c", "text": "Rien, une visite ne veut rien dire", "correct": false, "feedback": "Une visite sur une page précise est un vrai signal."}]}, {"prompt": "Vous n'êtes pas sûr que le permis trouvé concerne bien la bonne entreprise. Que faites-vous ?", "explanation": "", "options": [{"id": "a", "text": "Vous ne l'utilisez pas comme accroche", "correct": true, "feedback": "Une accroche fausse détruit la crédibilité du message."}, {"id": "b", "text": "Vous l'utilisez quand même, c'est probable", "correct": false, "feedback": "Si c'est faux, le prospect le voit tout de suite."}, {"id": "c", "text": "Vous reformulez de façon vague", "correct": false, "feedback": "Un signal vague n'apporte rien."}]}, {"prompt": "Pour quelle offre la saisonnalité est-elle un bon signal ?", "explanation": "", "options": [{"id": "a", "text": "La location de froid avant le pic de mai à août", "correct": true, "feedback": "Le besoin est prévisible : on arrive avant le pic."}, {"id": "b", "text": "Un logiciel comptable", "correct": false, "feedback": "Pas de pic saisonnier marqué."}, {"id": "c", "text": "Aucune, la saisonnalité n'est pas un signal", "correct": false, "feedback": "Elle l'est quand le besoin revient chaque année."}]}]}, {"id": "cm5", "t": "Cold emailing", "o": "Écrire des séquences courtes, personnalisées et crédibles, qui donnent envie de répondre.", "tool": "t_cu", "c": [["La structure d'un email", 20, [{"type": "table", "rows": [["Partie", "Rôle"], ["Objet", "Court, concret, sans effet marketing"], ["Paragraphe 1", "100 % personnalisé : l'entreprise, son signal, son contexte"], ["Paragraphe 2", "Ce que le client apporte, une preuve (référence citable), sans jargon"], ["CTA", "Une seule demande simple : un échange, une visite, une landing page, un ebook"]]}, {"type": "callout", "tone": "info", "title": "Le ton", "md": "De pair à pair, professionnel, vouvoiement, civilité et nom de famille. Pas de formules qui sonnent IA, pas de superlatifs, pas de clichés. Dans les secteurs sérieux (défense, aéro, santé), encore plus sobre."}]], ["Les séquences", 15, [{"type": "table", "rows": [["Bonne pratique", "Détail"], ["Séquences courtes", "2 emails suffisent souvent ; certains clients refusent les séquences de 3"], ["Multicanal", "Exemple : J1 email, J5 LinkedIn, J8 relance"], ["Langue", "FR ou NL selon le contact ; anglais pour les campagnes internationales si le client le veut"], ["Segmenter ou pas", "Un email commun peut suffire ; on sépare quand les profils ont des enjeux différents (ex. ingénieur vs acheteur)"]]}, {"type": "callout", "tone": "warn", "title": "Références clients", "md": "On peut citer des clients du client, mais sans dire ni sous-entendre pour quel produit ils travaillent ensemble si le client ne le permet pas."}]], ["Tags dynamiques et import", 15, [{"type": "text", "md": "La personnalisation passe par des **tags** remplis dans la base (ex. une phrase sur le projet, une version courte pour l'objet). Avant l'import dans Catch Up :"}, {"type": "checklist", "title": "Avant d'importer une campagne", "items": ["Les noms de colonnes de tags ne reprennent pas un champ existant de Catch Up (ex. « accroche » est déjà pris)", "Civilité, prénom et nom sont séparés", "Les lignes sans donnée de personnalisation ont une variante générique", "Le fichier est en CSV point-virgule si demandé", "Un email test a été relu avec de vraies données"]}]]], "quiz": [{"prompt": "Que contient le premier paragraphe d'un cold email ?", "explanation": "", "options": [{"id": "a", "text": "Une personnalisation liée à l'entreprise et à son signal", "correct": true, "feedback": "C'est ce qui montre qu'on a fait l'effort de comprendre sa situation."}, {"id": "b", "text": "La présentation complète du client", "correct": false, "feedback": "Le prospect ne lit pas une plaquette."}, {"id": "c", "text": "Les tarifs", "correct": false, "feedback": "Trop tôt et hors sujet."}]}, {"prompt": "Votre client refuse qu'on dise sur quel produit une référence travaille avec lui. Comment la citer ?", "explanation": "", "options": [{"id": "a", "text": "En nommant la référence sans parler du produit", "correct": true, "feedback": "On respecte la limite fixée par le client."}, {"id": "b", "text": "En précisant le produit pour être crédible", "correct": false, "feedback": "C'est exactement ce qui a été refusé."}, {"id": "c", "text": "On ne cite jamais de références", "correct": false, "feedback": "Une référen /* Progression : une leçon est validée quand son enregistrement de progression est "completed".
   Quiz : passe à "completed" quand le score minimum est atteint.
   Exercice : passe à "completed" quand le référent valide.
   Un module est validé quand toutes ses leçons le sont. */
/* Durées : jamais saisies à la main. Une leçon se lit à environ 200 mots par minute (texte, encadrés, listes, tableaux, textes à copier) ;
   un quiz compte une minute par question ; un exercice n'a pas de durée imposée ; les vidéos externes ne sont pas chronométrées. */
const WPM = 200;
const blockWords = b => { const w = t => String(t || '').replace(/<[^>]+>/g, ' ').split(/\s+/).filter(Boolean).length;
  return w(b.md) + w(b.html) + w(b.title) + w(b.text) + w(b.caption) + (b.items || []).reduce((a, x) => a + w(x), 0) + (b.rows || []).flat().reduce((a, x) => a + w(x), 0); };
function lessonMin(l) {

  if (l.kind === 'quiz') { const q = quizOfLesson(l.id); return q ? Math.max(1, questionsOf(q.id).length) : 1; }
  const words = (l.blocks || []).reduce((a, b) => a + blockWords(b), 0);
  return Math.max(1, Math.ceil(words / WPM));
}
const hasVideo = l => (l.blocks || []).some(b => b.type === 'video');

const lessonDone = (u, lid) => DB.progress.some(p => p.user_id === u && p.lesson_id === lid && p.status === 'completed');
function moduleStats(u, mid) {
  const ls = lessonsOfModule(mid);
  const d = ls.filter(l => lessonDone(u, l.id)).length;
  return { done: d, total: ls.length, pct: ls.length ? Math.round(100 * d / ls.length) : 0, complete: ls.length > 0 && d === ls.length };
}
function moduleUnlocked(u, mid) {
  const m = byId('modules', mid), p = byId('paths', m.path_id);

}

  // Cursus : le cursus en cours est déplié, les autres résumés sur une ligne
  const cursus = ens.map(en => {
    const p = byId('paths', en.path_id), ps = pathStats(me.id, p.id), open = p.id === curPath;
    const head = `<a class="c-head" data-nav="parcours"><span class="c-title">${esc(p.title)} ${commonTag(p.id)}</span>

    </div>`;
}

          <p class="lead">${esc(m.objective)}</p>

          ${next && !locked ? `<a class="btn btn-lg" data-nav="lesson/${next.id}">${learner && s.done ? 'Continuer' : 'Commencer'}<span class="btn-sub">${esc(next.title)}</span></a>` : ''}

/* ----- Leçon ----- */
function embedUrl(url) {
  if (!url) return null;
  let mm = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{6,})/);
  if (mm) return 'https://www.youtube.com/embed/' + mm[1];
  mm = url.match(/loom\.com\/(?:share|embed)\/([\w-]+)/);
  if (mm) return 'https://www.loom.com/embed/' + mm[1];
  mm = url.match(/vimeo\.com\/(\d+)/);
  if (mm) return 'https://player.vimeo.com/video/' + mm[1];
  return null;
}
function renderBlock(b, i, ctx) {
  const IMG_SVG = hi('img');
  const PLAY_SVG = hi('play');
  const DL_SVG = hi('dl');
  switch (b.type) {
    case 'text': return `<div class="block block-text">${b.html || mdToHtml(b.md || '')}</div>`;
    case 'code': return `<div class="block code-block"><div class="code-head"><span>${esc(b.title || 'À copier')}</span><button class="btn secondary sm" type="button" data-act="code-copy" data-id="${ctx.lid}" data-i="${i}">Copier</button></div><pre>${esc(b.text || '')}</pre></div>`;
    case 'callout': return `<div class="block callout ${b.tone === 'info' ? 'info' : 'warn'}"><div class="callout-t">${esc(b.title || '')}</div><div class="block-text">${mdToHtml(b.md || '')}</div></div>`;
    case 'table': { const rows = b.rows || []; return `<div class="block table-block"><table class="doc-table"><thead><tr>${(rows[0] || []).map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; }
    case 'video': {
      const src = embedUrl(b.url);
      return `<div class="block">${src ? `<div class="video-frame"><iframe src="${esc(src)}" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe></div>`
        : b.url ? `<a class="video-card" href="${esc(b.url)}" target="_blank" rel="noopener"><span class="vc-play">${PLAY_SVG}</span><span style="min-width:0;"><span class="vc-src">Vidéo · ${esc(b.source || new URL(b.url).hostname.replace('www.', ''))}</span><span class="vc-title">${esc(b.title || b.url)}</span></span><span class="vc-go">Regarder</span></a>`
        : `<div class="ph video">${PLAY_SVG}<span>Vidéo à ajouter</span></div>`}${b.caption ? `<div class="caption">${esc(b.caption)}</div>` : ''}</div>`;
    }
    case 'image': {
      const pins = (b.annotations || []).map((a, k) => `<span class="pin" style="left:${a.x}%; top:${a.y}%">${k + 1}</span>`).join('');
      const media = b.url ? `<img src="${esc(b.url)}" alt="${esc(b.caption || '')}">` : `<div class="ph" style="aspect-ratio:16/9;">${IMG_SVG}<span>Capture d'écran à ajouter</span></div>`;
      return `<div class="block figure"><div class="annot">${media}${pins}</div>
        ${(b.annotations || []).length ? `<ul class="annot-list">${b.annotations.map((a, k) => `<li><b>${k + 1}</b>${esc(a.text)}</li>`).join('')}</ul>` : ''}
        ${b.caption ? `<div class="cap">${esc(b.caption)}</div>` : ''}</div>`;
    }
    case 'file': return `<div class="block"><a class="res-link" ${b.url ? `href="${esc(b.url)}" download` : 'data-act="nofile"'}><span class="ico">${DL_SVG}</span>
        <span><div class="t">${esc(b.name || 'Fichier')}</div><div class="s">${b.url ? 'Télécharger' : 'Fichier à ajouter'}${b.size ? ' · ' + esc(b.size) : ''}</div></span></a></div>`;
    case 'link': return `<div class="block"><a class="res-link" href="${esc(b.url)}" target="_blank" rel="noopener"><span class="ico">${I.link}</span>
        <span><div class="t">${esc(b.title || b.url)}</div><div class="s">${esc(b.caption || b.url)}</div></span></a></div>`;
    case 'checklist': {
      const state = ctx.checklist[i] || {};
      return `<div class="block"><div class="block-label">${esc(b.title || 'Checklist')}</div><div class="checklist">
        ${b.items.map((it, k) => { const on = ctx.done || !!state[k];
          return `<label class="${on ? 'checked' : ''}"><input type="checkbox" data-check="${ctx.lid}|${i}|${k}" ${on ? 'checked' : ''} ${ctx.done || !ctx.learner ? 'disabled' : ''}><span>${esc(it)}</span></label>`; }).join('')}
      </div></div>`;
    }
    default: return '';
  }
}

function renderLesson(lid) {

    return { ...header, html: crumb + `<div class="card empty"><div style="font-weight:600; margin-bottom:6px; color:var(--text)">Leçon verrouillée</div>

  }

  const prev = all[idx - 1], next = all[idx + 1];
  const nextLocked = learner && next && !moduleUnlocked(me.id, moduleOfLesson(next.id).id) && !(moduleOfLesson(next.id).id === m.id);
  const ctx = { lid, done, learner, checklist: (rec && rec.checklist) || {} };
  const body = l.kind === 'content'
    ? (l.blocks.length ? l.blocks.map((b, i) => renderBlock(b, i, ctx)).join('') : '<div class="ph">Contenu à rédiger</div>')

  let action = '';

    else action = `<span class="muted" style="font-size:12.5px;">${l.kind === 'quiz' ? 'Validée automatiquement quand le score minimum est atteint.' : 'Validée quand votre référent approuve l\'exercice.'}</span>`;

  const expert = moduleExperts(m.id)[0];
  const modLessons = lessonsOfModule(m.id), pos = modLessons.findIndex(x => x.id === lid);
  const strip = `<div class="step-strip" aria-label="Progression dans le module">${modLessons.map((x, k) => { const stt = learner ? lessonState(me.id, x) : 'todo';
    return `<a class="ss ${stt}${x.id === lid ? ' cur' : ''}" data-nav="lesson/${x.id}" title="${esc(x.title)}"></a>`; }).join('')}<span class="ss-txt">Étape ${pos + 1} sur ${modLessons.length} du module</span></div>`;
  const html = crumb + strip + (!learner ? `<div class="preview-banner">${PREVIEW_TXT}</div>` : '') + `
    <div class="grid-2">
      <div class="stack">
        <div class="card">
          <div class="lesson-body">
            <div class="meta-line" style="margin:0 0 18px;">${KIND_LABEL[l.kind]}<span class="dot-sep"></span>${esc(durTxt(l))}${done ? '<span class="dot-sep"></span><span style="color:var(--ok)">Validée</span>' : ''}</div>

  if (rec.status === 'completed') return 'Leçon déjà validée.';
  rec.status = 'completed'; rec.completed_at = new Date().toISOString();
  let msg = 'Leçon validée.';
  if (moduleStats(u, m.id).complete && !DB.user_badges.some(b => b.user_id === u && b.module_id === m.id)) {
    DB.user_badges.push({ user_id: u, module_id: m.id, awarded_at: new Date().toISOString() });

    msg = `Module « ${m.title} » validé, badge obtenu.`;

      <p>${qs.length} questions · il faut ${q.pass_score}% pour valider${q.max_attempts && !trial ? ` · ${Math.max(0, left)} tentative(s) restante(s)` : ''}. Chaque réponse est expliquée.</p>
      ${trial ? '<p class="faint" style="font-size:12.5px;">Mode essai : vous passez le quiz comme un consultant, rien n\'est enregistré.</p>' : ''}

  }

      <div class="qz-recap">${qs.map((x, i) => `<div class="${((run.checks || {})[x.id] || {}).correct ? 'ok' : 'ko'}">${((run.checks || {})[x.id] || {}).correct ? OK_SVG : X_SVG}<span>${esc(x.prompt)}</span></div>`).join('')}</div>

        <button class="btn secondary" type="button" data-act="quiz-close" data-id="${l.id}">Terminer</button>
      </div>
    </div>`;

    <div class="qz-top"><span class="faint">Question ${run.idx + 1} sur ${qs.length}</span><span class="pbar" style="flex:1; max-width:220px;"><span style="width:${Math.round(100 * (run.idx + (revealed ? 1 : 0)) / qs.length)}%"></span></span></div>
    <div class="qz-q">${esc(x.prompt)}</div>
    <div class="qz-opts">${shuffledOpts(x).map((o, oi) => {
      let cls = '';

      if (revealed) cls = isOk ? ' ok' : o.id === picked ? ' ko' : ' dim';
      else if (o.id === picked) cls = ' sel';
      return `<button class="qz-opt${cls}" type="button" ${revealed ? 'disabled' : `data-act="quiz-pick" data-id="${l.id}" data-o="${o.id}"`}><span class="qz-letter">${'ABCDEF'[oi]}</span><span>${esc(o.text)}${revealed && o.id === picked && ck.feedback ? `<span class="qz-fb">${esc(ck.feedback)}</span>` : ''}</span></button>`;
    }).join('')}</div>
    ${revealed ? (() => { const ck = (run.checks || {})[x.id] || {}; return `<div class="qz-verdict ${ck.correct ? 'ok' : 'ko'}">${ck.correct ? 'Bonne réponse.' : 'Ce n\'est pas la bonne réponse.'}${ck.explanation ? ' ' + esc(ck.explanation) : ''}</div>`; })() : ''}
    <div style="display:flex; justify-content:flex-end; margin-top:14px;">
      ${revealed ? `<button class="btn" type="button" data-act="quiz-next" data-id="${l.id}">${run.idx + 1 < qs.length ? 'Question suivante' : 'Voir mon score'}</button>`
        : `<button class="btn" type="button" data-act="quiz-check" data-id="${l.id}" ${picked ? '' : 'disabled'}>Valider ma réponse</button>`}
    </div>
  </div>`;
}
/* Ordre des réponses mélangé de façon stable (la bonne réponse n'est pas toujours la première) */
function shuffledOpts(x) {
  const h = str => { let v = 0; for (const c of str) v = (v * 31 + c.charCodeAt(0)) >>> 0; return v; };
  return [...x.options].sort((a, b) => h(x.prompt + a.id) - h(x.prompt + b.id));
}
/* Une réponse : vérifiée localement si les bonnes réponses sont connues (démo, référent, admin), sinon par le serveur */
async function checkAnswer(x, optId) {
  if (x.options.some(o => 'correct' in o)) {
    const ok = x.options.find(o => o.correct), o = x.options.find(o => o.id === optId) || {};
    return { correct: !!o.correct, feedback: o.feedback || '', correct_option: ok ? ok.id : null, explanation: x.explanation || '' };
  }
  const { data, error } = await sb.rpc('check_answer', { p_question: x.id, p_option: optId });
  if (error) throw error;
  return data || {};
}
async function finishQuiz(lid) {
  const q = quizOfLesson(lid), qs = questionsOf(q.id), run = quizRun[lid];
  const good = qs.filter(x => ((run.checks || {})[x.id] || {}).correct).length;
  const score = Math.round(100 * good / qs.length), passed = score >= q.pass_score;
  run.result = { score, passed, good };
  if (!isEnrolledIn(me.id, moduleOfLesson(lid).path_id)) return;   // essai : rien n'est enregistré
  if (SB_READY) {   // enregistrement et validation de la leçon par le serveur
    const { data, error } = await sb.rpc('submit_quiz', { p_quiz: q.id, p_answers: run.answers });
    if (error) { toast('Enregistrement du quiz impossible : ' + error.message); return; }
    run.result = { score: data.score, passed: data.passed, good };
    await refreshTables(['progress', 'quiz_attempts', 'user_badges', 'certificates', 'notifications']);
    if (data.passed) toast('Quiz validé.');
    return;
  }
  DB.quiz_attempts.push({ id: uid('qa'), quiz_id: q.id, user_id: me.id, answers: { ...run.answers }, score, passed, created_at: new Date().toISOString() });
  if (passed && !lessonDone(me.id, lid)) { const msg = completeLesson(me.id, lid); toast(msg); }
}

const fmtSize = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' Mo' : Math.max(1, Math.round(n / 1024)) + ' Ko';

document.addEventListener('click', e => {

   Dossiers (un dossier = un rôle métier) et cursus
   Un cursus lié à plusieurs dossiers devient un tronc commun.

const FOLDER_COLORS = ['#266DF0', '#1f7a3e', '#8a6500', '#a02323', '#126b76', '#2f4dcb', '#6b6b75'];
const FOLDER_SVG = hi('folder');
function pathMeta(pid) {
  const mods = modulesOfPath(pid);
  const ls = mods.flatMap(m => lessonsOfModule(m.id));
  return { modules: mods.length, lessons: ls.length, quiz: ls.filter(l => l.kind === 'quiz').length, ex: ls.filter(l => l.kind === 'exercise').length,
           minutes: mods.reduce((s, m) => s + (m.est_minutes || 0), 0), enrolled: DB.path_enrollments.filter(e => e.path_id === pid).length };
}
function folderAvg(fid) {
  const mem = membersOfFolder(fid), paths = pathsOfFolder(fid);
  if (!mem.length || !paths.length) return null;
  const vals = mem.map(u => { const ls = paths.flatMap(p => pathLessons(p.id)); return ls.length ? ls.filter(l => lessonDone(u.id, l.id)).length / ls.length : 0; });
  return Math.round(100 * vals.reduce((a, b) => a + b, 0) / vals.length);
}
const folderChip = f => `<a class="folder-chip" data-nav="folder/${f.id}"><span class="folder-dot" style="background:${esc(f.color)}"></span>${esc(f.name)}</a>`;

/* Inscriptions automatiques : chaque membre d'un dossier est inscrit à tous ses cursus */
function syncFolderEnrollments(fid, silent) {
  let added = 0;
  membersOfFolder(fid).forEach(u => pathsOfFolder(fid).filter(p => p.published).forEach(p => {
    if (DB.path_enrollments.some(e => e.user_id === u.id && e.path_id === p.id)) return;
    DB.path_enrollments.push({ id: uid('en'), path_id: p.id, user_id: u.id, assigned_by: me && me.id, start_date: new Date().toISOString(), due_date: new Date(Date.now() + 14 * DAY).toISOString() });
    if (!silent) notify(u.id, 'assignment', 'Nouveau cursus assigné', p.title, '#/parcours');
    added++;
  }));
  return added;
}
/* Désinscription : seulement si aucun autre dossier de la personne ne contient le cursus et qu'elle n'a pas commencé */
function pruneEnrollments(uidList, pid) {
  uidList.forEach(u => {
    const stillLinked = foldersOfUser(u).some(f => pathsOfFolder(f.id).some(p => p.id === pid));
    const started = pathLessons(pid).some(l => progressRec(u, l.id));
    if (!stillLinked && !started) DB.path_enrollments = DB.path_enrollments.filter(e => !(e.user_id === u && e.path_id === pid));
  });
}
function linkPathToFolder(pid, fid) {
  if (DB.folder_paths.some(fp => fp.folder_id === fid && fp.path_id === pid)) return;
  const pos = Math.max(0, ...DB.folder_paths.filter(fp => fp.folder_id === fid).map(fp => fp.position)) + 1;
  DB.folder_paths.push({ folder_id: fid, path_id: pid, position: pos });
  syncFolderEnrollments(fid);
}
function unlinkPathFromFolder(pid, fid) {
  DB.folder_paths = DB.folder_paths.filter(fp => !(fp.folder_id === fid && fp.path_id === pid));
  pruneEnrollments(membersOfFolder(fid).map(u => u.id), pid);
}

/* ----- Actions dossiers / cursus ----- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a || !me) return;
  const act = a.dataset.act, id = a.dataset.id, fid = a.dataset.f;
  if (act === 'modal-close') closeModal();
  else if (act === 'folder-new') {
    openModal('Nouveau dossier', folderForm(null), `<button class="btn secondary" type="button" data-act="modal-close">Annuler</button><button class="btn" type="button" data-act="folder-save">Créer le dossier</button>`);
  } else if (act === 'folder-edit') {
    openModal('Modifier le dossier', folderForm(byId('folders', fid)), `<button class="btn secondary" type="button" data-act="modal-close">Annuler</button><button class="btn" type="button" data-act="folder-save" data-f="${fid}">Enregistrer</button>`);
  } else if (act === 'folder-save') {
    const name = $('fName').value.trim();
    if (!name) { toast('Donnez un nom au dossier.'); return; }
    const color = (document.querySelector('input[name="fColor"]:checked') || {}).value || FOLDER_COLORS[0];
    const desc = $('fDesc').value.trim();
    if (fid) Object.assign(byId('folders', fid), { name, description: desc, color });
    else {
      const nf = { id: uid('f'), name, description: desc, color, position: DB.folders.length + 1 };
      DB.folders.push(nf);
      // Le tronc commun existant est proposé d'office dans un nouveau dossier
      DB.paths.filter(p => isCommonPath(p.id)).forEach(p => linkPathToFolder(p.id, nf.id));
      closeModal(); navigate('folder/' + nf.id); toast('Dossier créé, tronc commun ajouté.'); return;
    }
    closeModal(); render(true); toast('Dossier enregistré.');
  } else if (act === 'fp-link-open') {
    const paths = pathsOfFolder(fid), others = DB.paths.filter(p => !paths.some(x => x.id === p.id));
    openModal('Ajouter un cursus existant', `<div class="muted" style="font-size:12.5px; margin-bottom:10px;">Un cursus présent dans plusieurs dossiers devient un tronc commun : son contenu et la progression sont partagés.</div>
      <div class="check-list">${others.map(p => `<label class="check-row"><input type="checkbox" value="${p.id}"><span><b>${esc(p.title)}</b> ${commonTag(p.id)}<br><span class="faint" style="font-size:11.5px;">${foldersOfPath(p.id).map(f => esc(f.name)).join(', ') || 'Non classé'}</span></span></label>`).join('')}</div>`,
      `<button class="btn secondary" type="button" data-act="modal-close">Annuler</button><button class="btn" type="button" data-act="fp-link" data-f="${fid}">Ajouter au dossier</button>`);
  } else if (act === 'fp-link') {
    const ids = [...document.querySelectorAll('#modalBody input:checked')].map(x => x.value);
    if (!ids.length) { toast('Sélectionnez au moins un cursus.'); return; }
    ids.forEach(pid => linkPathToFolder(pid, fid));
    closeModal(); render(true); toast(`${ids.length} cursus ajouté${ids.length > 1 ? 's' : ''}. Les membres sont inscrits.`);
  } else if (act === 'fp-remove') {
    unlinkPathFromFolder(id, fid); render(true); toast('Cursus retiré du dossier.');
  } else if (act === 'fp-up' || act === 'fp-down') {
    const list = DB.folder_paths.filter(fp => fp.folder_id === fid).sort(sortPos);
    const i = list.findIndex(fp => fp.path_id === id), j = act === 'fp-up' ? i - 1 : i + 1;
    if (j < 0 || j >= list.length) return;
    [list[i].position, list[j].position] = [list[j].position, list[i].position];
    render(true);

const wordCount = t => (String(t).match(/\S+/g) || []).length;
const fmtNum = n => n.toLocaleString('fr-FR');
const SRC_KIND = { voice: 'Dictée', paste: 'Texte collé', pdf: 'PDF', docx: 'Word', md: 'Markdown', txt: 'Texte' };

/* ----- Markdown -> HTML (contenu des leçons) ----- */
function mdInline(t) {
  return esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)([^*]+?)\*/g, '$1<em>$2</em>').replace(/`([^`]+)`/g, '<code>$1</code>');
}
function mdToHtml(md) {
  const lines = String(md || '').replace(/\r/g, '').split('\n');
  let html = '', list = null, para = [];
  const flushP = () => { if (para.length) { html += '<p>' + mdInline(para.join(' ')) + '</p>'; para = []; } };
  const flushL = () => { if (list) { html += `<${list.t}>` + list.items.map(i => '<li>' + mdInline(i) + '</li>').join('') + `</${list.t}>`; list = null; } };
  for (const raw of lines) {
    const line = raw.trim(); let m;
    if (!line) { flushP(); flushL(); continue; }
    if ((m = line.match(/^(#{1,6})\s+(.*)/))) { flushP(); flushL(); const lv = Math.min(4, m[1].length + 2); html += `<h${lv}>${mdInline(m[2])}</h${lv}>`; continue; }
    if ((m = line.match(/^[-*•]\s+(.*)/))) { flushP(); if (!list || list.t !== 'ul') { flushL(); list = { t: 'ul', items: [] }; } list.items.push(m[1]); continue; }
    if ((m = line.match(/^\d+[.)]\s+(.*)/))) { flushP(); if (!list || list.t !== 'ol') { flushL(); list = { t: 'ol', items: [] }; } list.items.push(m[1]); continue; }
    if ((m = line.match(/^>\s?(.*)/))) { flushP(); flushL(); html += `<blockquote>${mdInline(m[1])}</blockquote>`; continue; }
    flushL(); para.push(line);
  }
  flushP(); flushL();
  return html;
}

/* ----- Lecture des fichiers (PDF, Word, Markdown, texte) ----- */
const loadedLibs = {};
function loadScript(urls) {
  return urls.reduce((p, u) => p.catch(() => new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = u;
    s.onload = () => res(u); s.onerror = () => { s.remove(); rej(new Error('Chargement impossible : ' + u)); };
    document.head.appendChild(s);
  })), Promise.reject(new Error('start')));
}
async function extractPdf(file) {
  if (!window.pdfjsLib) loadedLibs.pdf = await loadScript(LIBS.pdf);
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = (loadedLibs.pdf || LIBS.pdf[0]).replace('pdf.min.js', 'pdf.worker.min.js');
  const doc = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const pages = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const tc = await (await doc.getPage(i)).getTextContent();
    pages.push(tc.items.map(it => it.str + (it.hasEOL ? '\n' : '')).join('').replace(/[ \t]+\n/g, '\n'));
  }
  return pages.join('\n\n');
}
async function extractDocx(file) {
  if (!window.mammoth) await loadScript(LIBS.mammoth);
  const buf = await file.arrayBuffer();
  // Markdown conserve les titres du document Word, utiles pour la structure du cursus
  const r = window.mammoth.convertToMarkdown ? await window.mammoth.convertToMarkdown({ arrayBuffer: buf }) : await window.mammoth.extractRawText({ arrayBuffer: buf });
  return r.value.replace(/\\([\\`*_{}\[\]()#+\-.!>])/g, '$1').replace(/__(.+?)__/g, '**$1**');
}
async function readSourceFile(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (ext === 'pdf') return { ext: 'pdf', text: await extractPdf(file) };
  if (ext === 'docx') return { ext: 'docx', text: await extractDocx(file) };
  if (['md', 'markdown'].includes(ext)) return { ext: 'md', text: await file.text() };
  if (['txt', 'text', 'csv'].includes(ext)) return { ext: 'txt', text: await file.text() };
  if (ext === 'doc') throw new Error('Format .doc non pris en charge : enregistrez le fichier en .docx.');
  throw new Error(`Format .${ext} non pris en charge (PDF, Word .docx, Markdown ou texte).`);
}
async function importFiles(files) {
  for (const file of [...files]) {
    const job = { id: uid('imp'), name: file.name, error: null };
    studio.importing.push(job); renderStudioSafe();
    try {
      const { ext, text } = await readSourceFile(file);
      const clean = text.replace(/\u0000/g, '').replace(/\n{3,}/g, '\n\n').trim();
      if (wordCount(clean) < 5) throw new Error(ext === 'pdf' ? 'Aucun texte trouvé : PDF scanné (image). Utilisez un PDF texte ou collez le contenu.' : 'Le fichier est vide.');
      studio.sources.push({ id: uid('src'), kind: ext, name: file.name, text: clean, words: wordCount(clean) });
      studio.importing = studio.importing.filter(j => j !== job);
    } catch (err) {
      job.error = err.message || String(err);
    }
    renderStudioSafe();
  }
}
const renderStudioSafe = () => { if (currentRoute.split('/')[0] === 'ai-studio') render(true); };

/* ----- Dictée vocale (Web Speech API, Chrome et Edge) ----- */
const dict = { rec: null, on: false, base: '', finals: '', startedAt: 0, timer: null };
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
function applyVoiceCommands(t) {
  return t.replace(/\s*\bnouveau paragraphe\b\s*/gi, '\n\n').replace(/\s*\bnouvelle partie\b\s*/gi, '\n\n## ').replace(/\s*\bà la ligne\b\s*/gi, '\n');
}
function startDictation() {
  if (!SpeechRec) { toast('La dictée fonctionne dans Chrome ou Edge. Vous pouvez aussi coller une transcription.'); return; }
  const ta = $('dictText');
  dict.base = ta && ta.value ? ta.value.replace(/\s*$/, ' ') : '';
  dict.finals = '';
  const rec = new SpeechRec();
  rec.lang = 'fr-FR'; rec.continuous = true; rec.interimResults = true;
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) dict.finals += applyVoiceCommands(r[0].transcript.trim()) + ' ';
      else interim += r[0].transcript;
    }
    studio.dictText = dict.base + dict.finals;
    const el = $('dictText'); if (el) { el.value = studio.dictText + interim; el.scrollTop = el.scrollHeight; }
  };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { toast("Accès au micro refusé : autorisez le micro pour ce site (ouvrez le fichier dans Chrome si l'aperçu le bloque)."); stopDictation(); }
    else if (e.error === 'network') { toast('La dictée a besoin d\'une connexion internet.'); stopDictation(); }
  };
  // Chrome coupe la reconnaissance après un silence : on relance tant que l'enregistrement est actif
  rec.onend = () => { if (dict.on) { try { rec.start(); } catch (_) {} } };
  try { rec.start(); } catch (_) { toast('Impossible de démarrer la dictée.'); return; }
  dict.rec = rec; dict.on = true; dict.startedAt = Date.now();
  dict.timer = setInterval(() => {
    const el = $('dictTimer'); if (!el) return;
    const s = Math.floor((Date.now() - dict.startedAt) / 1000);
    el.textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  }, 500);
  renderStudioSafe();
}
function stopDictation() {
  dict.on = false;
  clearInterval(dict.timer);
  if (dict.rec) { try { dict.rec.stop(); } catch (_) {} dict.rec = null; }
  const el = $('dictText'); if (el) studio.dictText = el.value;
  renderStudioSafe();
}
