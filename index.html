<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hike UP Academy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ===== Design system Hike UP (Catch-Up v2, style Attio) : tokens =====
     Une valeur = un token. Aucune couleur, rayon ou ombre en dur dans les règles. */
  :root {
    --bg: #f7f7f8;              /* fond de page */
    --card: #ffffff;            /* contenu */
    --border: #ececef;          /* hairline */
    --border-strong: #e3e3e6;   /* cartes, champs, boutons secondaires */
    --text: #1a1a1f;
    --text-muted: #6b6b75;
    --text-faint: #a1a1aa;      /* méta seulement */
    --accent: #266DF0;
    --accent-hover: #1B5DE0;
    --accent-soft: #E9F0FD;
    --hover-1: var(--hover-1);         /* icônes carrées, actif nav */
    --hover-2: var(--hover-2);         /* items denses, hover nav */
    --hover-3: var(--hover-3);         /* ghost, boutons secondaires */
    --hover-4: var(--hover-4);         /* en-tête de table, lignes */
    --shadow-card: 0 1px 3px rgba(16,17,21,.06), 0 1px 2px rgba(16,17,21,.03);
    --shadow-lift: 0 4px 16px rgba(38,109,240,.12);
    --shadow-menu: 0 10px 30px rgba(0,0,0,.14);
    --shadow-modal: 0 20px 50px rgba(0,0,0,.25);
    --shadow-float: 0 12px 34px rgba(16,17,21,.18);
    --radius: 14px;  --radius-lg: 16px;  --radius-md: 10px;  --radius-sm: 8px;  --pill: 999px;
    --control: 32px;
    --sidebar-w: 240px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --st-nouveau-bg: #e8f6ee; --st-nouveau-fg: #1f7a3e;
    --st-devis-bg: #eaf0ff;   --st-devis-fg: #2f4dcb;
    --st-attente-bg: #fff3d6; --st-attente-fg: #8a6500;
    --st-rdv-bg: #e0f4f6;     --st-rdv-fg: #126b76;
    --st-gagne-bg: #d9f5e3;   --st-gagne-fg: var(--st-gagne-fg);
    --st-perdu-bg: #fde2e2;   --st-perdu-fg: #a02323;
    --dot-red: #e5484d;
    --danger-solid: #d93025; --danger-solid-hover: #b42318;   /* bouton de confirmation de suppression (§8.12) */
    --late-dot: #e8a317;
    --z-backdrop: 2070; --z-modal: 2080; --z-float: 2090;      /* échelle §5.6 */
    /* Statuts de l'Academy rattachés aux statuts du design system */
    --ok: var(--st-nouveau-fg);
    --danger: var(--st-perdu-fg);
    --st-done-bg: var(--st-gagne-bg);   --st-done-fg: var(--st-gagne-fg);
    --st-prog-bg: var(--st-devis-bg);   --st-prog-fg: var(--st-devis-fg);
    --st-wait-bg: var(--st-attente-bg); --st-wait-fg: var(--st-attente-fg);
    --st-lock-bg: var(--hover-1);       --st-lock-fg: var(--text-muted);
    --st-late-bg: var(--st-perdu-bg);   --st-late-fg: var(--st-perdu-fg);
    /* Typographie (§5.3) */
    --fs-screen: 16px;   /* titre écran (barre du haut) */
    --fs-home: 32px;     /* titre accueil (v2.5 : 32/650 centré) */
    --fs-kpi: 24px;
    --fs-title: 15px;  --lh-title: 21px;   /* titre de section */
    --fs-head: 14px;   --lh-head: 20px;    /* titre d'élément */
    --fs-body: 14px;   --lh-body: 20px;
    --fs-sub: 13px;    --lh-sub: 18px;
    --fs-foot: 12px;   --lh-foot: 16px;    /* méta */
    --fs-eyebrow: 11px;
    --gap-section: 28px; --gap-group: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { overflow-y: scroll; scrollbar-gutter: stable; }
  body {
    font-family: var(--font-sans);
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; font-size: 14px; line-height: 1.4; min-height: 100vh;
    overflow-x: clip;
  }
  button, [role="button"], a, .nav-item, .ftag, .chip, .acc-head, .demo-acc, .notif-item, .sr-item { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .5; }
  a { color: inherit; text-decoration: none; }

  /* ===== Shell ===== */
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: var(--sidebar-w); background: var(--bg); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; flex-shrink: 0; }
  .sidebar-brand { padding: 14px 16px; height: 54px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
  .brand-name { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
  .brand-name small { display: block; font-weight: 500; font-size: 11px; color: var(--text-faint); letter-spacing: 0; }
  .sidebar-nav { padding: 10px 10px; flex: 1 1 auto; overflow-y: auto; }
  .sidebar-section-title { font-size: var(--fs-eyebrow); text-transform: uppercase; letter-spacing: .04em; color: var(--text-faint); padding: 16px 10px 4px; font-weight: 600; }
  .sidebar-section-title:first-child { padding-top: 2px; }
  .nav-item { display: flex; align-items: center; gap: 9px; height: var(--control); padding: 0 10px; border-radius: var(--radius-sm); color: var(--text); font-size: 13.5px; font-weight: 500; user-select: none; transition: background .12s ease; }
  .nav-item:hover { background: var(--hover-2); }
  .nav-item.active { background: var(--hover-1); }
  .nav-item.active svg { stroke: var(--accent); }
  .nav-item svg { width: 15px; height: 15px; stroke: var(--text-muted); flex-shrink: 0; }
  .nav-item .nav-count { margin-left: auto; font-size: 11px; font-weight: 600; color: #fff; background: var(--accent); border-radius: var(--pill); padding: 1px 7px; font-variant-numeric: tabular-nums; }
  .sidebar-user { border-top: 1px solid var(--border); padding: 14px; display: flex; align-items: center; gap: 10px; }
  .sidebar-user .info { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .sidebar-user .name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidebar-user .role { font-size: 11.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { background: none; border: none; color: var(--text-muted); width: 28px; height: 28px; border-radius: var(--radius-sm); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .icon-btn:hover { background: var(--hover-1); color: var(--text); }
  .icon-btn svg { width: 16px; height: 16px; }

  .main { flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--border); border-bottom: none; border-radius: var(--radius-lg) var(--radius-lg) 0 0; margin: 10px 10px 0 0; min-height: calc(100vh - 10px); }
  /* Barre du haut 54px : fil + titre écran à gauche, recherche et notifications à droite */
  .topbar { position: sticky; top: 0; z-index: 40; height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 24px; background: var(--card); border-bottom: 1px solid var(--border); border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
  .tb-path { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: var(--fs-screen); white-space: nowrap; overflow: hidden; }
  .tb-path a { color: var(--text-muted); font-weight: 500; flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .tb-path a:hover { color: var(--text); }
  .tb-path .sep { color: var(--text-faint); }
  .tb-title { font-weight: 600; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .header-tools { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .search-btn { display: inline-flex; align-items: center; gap: 8px; height: var(--control); font: inherit; font-size: 13px; color: var(--text-faint); background: var(--card); border: 1px solid var(--border-strong); border-radius: var(--radius-md); padding: 0 10px; min-width: 220px; }
  .search-btn:hover { background: var(--hover-3); }
  .search-btn kbd { margin-left: auto; font: inherit; font-size: 11px; color: var(--text-muted); background: var(--hover-1); border-radius: 5px; padding: 1px 6px; }
  .bell { position: relative; width: var(--control); height: var(--control); border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--card); color: var(--text-muted); display: inline-flex; align-items: center; justify-content: center; }
  .bell:hover { color: var(--text); background: var(--hover-3); }
  .bell svg { width: 16px; height: 16px; }
  .bell .dot { position: absolute; top: -5px; right: -5px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: var(--pill); background: var(--dot-red); color: #fff; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; border: 2px solid var(--card); }
  .burger { display: none; }
  .page-in { max-width: 1280px; margin: 0 auto; padding: 24px 24px 64px; }
  .page-sub { font-size: var(--fs-sub); color: var(--text-muted); margin: -4px 0 20px; }
  .home-h { font-size: var(--fs-home); line-height: 32px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
  .home-sub { font-size: var(--fs-sub); color: var(--text-muted); margin: 2px 0 24px; }

  /* ===== Composants ===== */
  .card { background: var(--card); border: 1px solid var(--border-strong); border-radius: var(--radius); box-shadow: var(--shadow-card); }
  .section-label { font-size: var(--fs-title); line-height: var(--lh-title); font-weight: 600; color: var(--text); margin: var(--gap-section) 0 10px; }
  .section-label:first-child { margin-top: 0; }
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 8px; }
  .kpi { padding: 16px 18px; }
  .kpi .label { color: var(--text-muted); font-size: 12.5px; font-weight: 400; }
  .kpi .value { font-size: var(--fs-kpi); font-weight: 700; margin-top: 4px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .kpi .sub { font-size: 11px; color: var(--text-faint); margin-top: 3px; }
  /* Boutons (§8.1) : primaire noir, secondaire blanc bordé, 32px */
  .btn { background: #111; color: #fff; border: 1px solid #111; border-radius: var(--radius-sm); height: var(--control); padding: 0 12px; font: inherit; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: background .12s ease; }
  .btn:hover { background: #000; border-color: #000; }
  .btn.secondary { background: var(--card); color: var(--text); border-color: var(--border-strong); }
  .btn.secondary:hover { background: var(--hover-3); }
  .btn.sm { height: 28px; padding: 0 11px; font-size: 12.5px; }
  .btn:focus-visible, .icon-btn:focus-visible, .nav-item:focus-visible, .ftag:focus-visible, .qz-opt:focus-visible, a:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); }
  .ftag { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border: 1px solid var(--border-strong); border-radius: var(--pill); background: var(--card); font-size: 12.5px; font-weight: 500; color: var(--text-muted); user-select: none; font-family: inherit; }
  .ftag:hover { background: var(--hover-3); }
  .ftag.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-soft); }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: var(--pill); font-size: 11.5px; font-weight: 500; white-space: nowrap; }
  .b-done { background: var(--st-done-bg); color: var(--st-done-fg); }
  .b-prog { background: var(--st-prog-bg); color: var(--st-prog-fg); }
  .b-wait { background: var(--st-wait-bg); color: var(--st-wait-fg); }
  .b-lock { background: var(--st-lock-bg); color: var(--st-lock-fg); }
  .b-late { background: var(--st-late-bg); color: var(--st-late-fg); }
  .b-role { background: var(--accent-soft); color: var(--accent); }
  .avatar { border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; color: var(--text); text-transform: uppercase; flex-shrink: 0; overflow: hidden; border: 1px solid var(--border-strong); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .muted { color: var(--text-muted); }
  .faint { color: var(--text-faint); }
  .pbar { height: 4px; border-radius: var(--pill); background: var(--hover-1); overflow: hidden; }
  .pbar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
  .pbar.ok > span { background: var(--ok); }
  [data-nav] { cursor: pointer; }
  .empty { padding: 38px 24px; text-align: center; color: var(--text-muted); font-size: var(--fs-sub); }
  .card.empty { border: 1px dashed var(--border-strong); background: var(--hover-4); box-shadow: none; }

  /* Tableau */
  .table-card { padding: 0; overflow: hidden; }
  /* Feuille de liste : tableau bord à bord, sans carte ; en-tête blanc 45px, lignes 44px */
  .sheet { border: none; border-top: 1px solid var(--border); border-radius: 0; box-shadow: none; overflow: visible; }
  .sheet thead th { background: var(--card); height: 45px; padding: 10px 14px; font-size: 13px; font-weight: 500; color: var(--text-muted); }
  .sheet tbody td { height: 44px; padding: 9px 14px; }
  .sheet tbody tr:last-child td { border-bottom: 1px solid var(--border); }
  .table-head { padding: 16px 22px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
  .table-head .title { font-weight: 600; font-size: 15px; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { text-align: left; font-size: 12px; font-weight: 500; color: var(--text-muted); padding: 9px 16px; background: var(--hover-4); border-bottom: 1px solid var(--border); white-space: nowrap; }
  tbody td { padding: 11px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--hover-4); }
  .cell-user { display: flex; align-items: center; gap: 10px; }
  .cell-user .n { font-weight: 600; }
  .cell-user .e { font-size: 11.5px; color: var(--text-faint); }

  /* Accordéons (arbre de parcours) */
  .acc { border: 1px solid var(--border-strong); border-radius: 12px; margin-bottom: 10px; overflow: hidden; background: #fff; }
  .acc-head { width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: #fff; border: none; font: inherit; text-align: left; color: var(--text); }
  .acc-head:hover { background: var(--hover-4); }
  .acc-num { width: 30px; height: 30px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .acc-main { flex: 1; min-width: 0; }
  .acc-title { font-weight: 600; font-size: 14px; }
  .acc-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .acc-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .acc-chev { color: var(--text-muted); transition: transform .18s; flex-shrink: 0; }
  .acc.open .acc-chev { transform: rotate(180deg); }
  .acc-body { display: none; padding: 4px 16px 16px 60px; border-top: 1px solid var(--border); background: var(--hover-4); }
  .acc.open .acc-body { display: block; }
  .chap { padding: 10px 0; border-bottom: 1px dashed var(--border); }
  .chap:last-child { border-bottom: none; }
  .chap-title { font-weight: 600; font-size: 13px; margin-bottom: 6px; }
  .lesson-line { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-muted); padding: 3px 0; }
  .lesson-line svg { width: 14px; height: 14px; flex-shrink: 0; }

  /* Écran en construction */
  .stub { padding: 26px 28px; max-width: 720px; }
  .stub-step { display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 3px 10px; margin-bottom: 12px; }
  .stub h3 { margin: 0 0 6px; font-size: 17px; }
  .stub p { margin: 0 0 14px; color: var(--text-muted); font-size: 13px; }
  .stub ul { margin: 0; padding-left: 18px; color: var(--text-muted); font-size: 13px; line-height: 1.8; }

  /* ===== Étape 2 : écrans consultant ===== */
  .grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .panel { padding: 18px 20px; }
  .panel-title { font-weight: 600; font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .panel-title .faint { font-weight: 500; font-size: 12px; }
  .resume { padding: 20px 22px; display: flex; align-items: center; gap: 18px; background: var(--card); }
  .resume-ico { width: 46px; height: 46px; border-radius: 12px; background: var(--accent); color: #fff; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .resume-ico svg { width: 22px; height: 22px; }
  .resume-kicker { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); font-weight: 700; }
  .resume-title { font-size: 17px; font-weight: 700; margin-top: 3px; }
  .resume-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; }
  .resume .btn { margin-left: auto; flex-shrink: 0; }
  .mod-row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid var(--border-strong); border-radius: 12px; background: #fff; margin-bottom: 10px; transition: border-color .12s, box-shadow .12s; }
  .mod-row:hover { border-color: var(--accent); box-shadow: var(--shadow-lift); }
  .mod-row.locked { background: var(--hover-4); }
  .mod-row.locked:hover { border-color: var(--border-strong); box-shadow: none; }
  .mod-row.locked .acc-num { background: var(--hover-1); color: var(--text-faint); }
  .mod-row.done .acc-num { background: var(--st-done-bg); color: var(--st-done-fg); }
  .mod-row .mod-prog { width: 150px; flex-shrink: 0; }
  .mod-row .mod-prog .l { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-faint); margin-bottom: 4px; }
  .mini-mod { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 12.5px; }
  .mini-mod .n { width: 20px; color: var(--text-faint); font-weight: 600; }
  .mini-mod .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini-mod .pbar { width: 80px; flex-shrink: 0; }
  .person { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .person:last-child { border-bottom: none; }
  .person .n { font-weight: 600; font-size: 13px; }
  .person .r { font-size: 11.5px; color: var(--text-muted); }
  .person .btn { margin-left: auto; }
  .session-line { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .session-line:last-child { border-bottom: none; }
  .session-date { width: 48px; flex-shrink: 0; text-align: center; background: var(--accent-soft); color: var(--accent); border-radius: 9px; padding: 5px 0; font-weight: 700; font-size: 15px; line-height: 1.1; }
  .session-date small { display: block; font-size: 10px; font-weight: 600; text-transform: uppercase; }
  .crumb { font-size: 12.5px; color: var(--text-muted); margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .crumb a:hover { color: var(--accent); }
  .crumb .sep { color: var(--text-faint); }
  .meta-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 18px; }
  .preview-banner { background: var(--st-wait-bg); color: var(--st-wait-fg); border-radius: 10px; padding: 9px 14px; font-size: 12.5px; margin-bottom: 16px; }
  .chap-card { margin-bottom: 12px; overflow: hidden; }
  .chap-head { padding: 12px 18px; font-weight: 600; font-size: 13.5px; background: var(--hover-4); border-bottom: 1px solid var(--border); }
  .chap-head span { color: var(--text-faint); font-weight: 500; margin-right: 6px; }
  .l-row { display: flex; align-items: center; gap: 12px; padding: 11px 18px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .l-row:last-child { border-bottom: none; }
  .l-row:hover { background: var(--hover-4); }
  .l-row.locked { color: var(--text-faint); }
  .l-row .dur { margin-left: auto; font-size: 11.5px; color: var(--text-faint); white-space: nowrap; }
  .st-ico { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1.5px solid var(--border-strong); color: var(--text-faint); background: #fff; }
  .st-ico svg { width: 12px; height: 12px; }
  .st-ico.done { background: var(--ok); border-color: var(--ok); color: #fff; }
  .st-ico.prog { border-color: var(--accent); color: var(--accent); }
  .st-dot { width: 42%; height: 42%; border-radius: 50%; background: currentColor; }
  .expert-card { display: flex; gap: 14px; align-items: center; }
  .expert-card .n { font-weight: 700; font-size: 14px; }
  .expert-card .r { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .input:focus, .select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .field-label { display: block; font-size: 12px; font-weight: 400; color: var(--text-muted); margin: 14px 0 6px; }
  .form .field-label:first-child, .modal-body .field-label:first-child { margin-top: 0; }
  .form-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .check-list { border: 1px solid var(--border-strong); border-radius: 12px; overflow: hidden; max-height: 320px; overflow-y: auto; }
  .check-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; cursor: pointer; }

  .toggles { display: flex; flex-direction: column; border: 1px solid var(--border-strong); border-radius: 12px; }

  /* Modale */
  .modal-box { background: var(--card); border-radius: var(--radius); width: 100%; max-width: 480px; box-shadow: var(--shadow-modal); display: flex; flex-direction: column; max-height: min(84vh, 760px); }

  /* Sauver / Créer / Valider = accent ; Fermer / Annuler = blanc bordé */

  .modal-actions .btn:not(.secondary):not(.danger):hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  /* Confirmation de suppression (.opp-del) */

  .opp-del__mark { width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--st-perdu-bg); color: var(--st-perdu-fg); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

  /* Supprimer : neutre au repos, rouge au survol seulement */
  .icon-btn[data-act$="-del"]:hover, .icon-btn[data-act="del-ask"]:hover, .person-chip button:hover { background: var(--st-perdu-bg); color: var(--st-perdu-fg); }

  /* ===== Studio IA ===== */
  .stepper { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .step { display: inline-flex; align-items: center; gap: 8px; background: none; border: none; font: inherit; font-size: 13px; font-weight: 600; color: var(--text-faint); padding: 0; }
  .step:disabled { opacity: 1; cursor: default; }
  .step-n { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--border-strong); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; background: #fff; }
  .step-n svg { width: 12px; height: 12px; }
  .step.cur { color: var(--text); } .step.cur .step-n { background: #111; border-color: #111; color: #fff; }
  .step.done { color: var(--text-muted); } .step.done .step-n { background: var(--ok); border-color: var(--ok); color: #fff; }
  .step-sep { width: 36px; height: 1.5px; background: var(--border-strong); }
  .studio-grid { grid-template-columns: minmax(0, 1fr) 360px; }
  .seg { display: flex; gap: 4px; background: var(--hover-1); border-radius: 12px; padding: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .seg-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: none; background: none; font: inherit; font-size: 13px; font-weight: 600; color: var(--text-muted); padding: 9px 10px; border-radius: 9px; white-space: nowrap; }

  .dict-head { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; }

  .mic-btn:hover { transform: scale(1.04); }
  .mic-btn svg { width: 26px; height: 26px; }
  .mic-btn.on { background: var(--danger); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(211,59,70,.45); } 70% { box-shadow: 0 0 0 16px rgba(211,59,70,0); } 100% { box-shadow: 0 0 0 0 rgba(211,59,70,0); } }
  .rec-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); margin: 0 4px 0 6px; vertical-align: 1px; }
  .textarea.big { min-height: 260px; font-size: 14px; line-height: 1.6; }
  .textarea.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.55; }
  .dropzone { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; border: 1.5px dashed var(--border-strong); border-radius: 14px; padding: 46px 20px; background: var(--hover-4); cursor: pointer; transition: border-color .12s, background .12s; }
  .dropzone:hover, .dropzone.over { border-color: var(--accent); background: var(--accent-soft); }
  .dz-ico { width: 46px; height: 46px; border-radius: 12px; background: #fff; border: 1px solid var(--border-strong); display: inline-flex; align-items: center; justify-content: center; color: var(--accent); margin-bottom: 6px; }
  .dz-ico svg { width: 20px; height: 20px; }

  .imp-line.err { color: var(--danger); display: block; }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .8s linear infinite; display: inline-block; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .src { border-bottom: 1px solid var(--border); padding: 9px 0; }
  .src:last-of-type { border-bottom: none; }
  .src-row { display: flex; align-items: center; gap: 10px; }

  .src-ico svg { width: 15px; height: 15px; }
  .src-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src-preview { margin-top: 8px; font-size: 12px; color: var(--text-muted); background: var(--hover-4); border-radius: 8px; padding: 10px; white-space: pre-wrap; max-height: 220px; overflow-y: auto; }
  .engine { display: flex; gap: 10px; align-items: flex-start; padding: 11px 12px; border: 1px solid var(--border-strong); border-radius: 12px; margin-bottom: 8px; cursor: pointer; font-size: 13px; }

  .engine input { accent-color: var(--accent); margin-top: 3px; }
  .err-banner { background: var(--st-late-bg); color: var(--st-late-fg); }
  .gen-card { max-width: 520px; margin: 30px auto; padding: 34px; text-align: center; }
  .gen-spark { width: 58px; height: 58px; border-radius: 16px; margin: 0 auto; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; animation: float 2.4s ease-in-out infinite; }
  .gen-spark svg { width: 26px; height: 26px; }
  @keyframes float { 50% { transform: translateY(-5px); } }
  .gen-phases { margin: 22px auto 0; text-align: left; display: inline-flex; flex-direction: column; gap: 10px; }
  .gen-phase { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--text-faint); }
  .gen-phase.cur { color: var(--text); font-weight: 600; } .gen-phase.done { color: var(--text-muted); }
  .gen-phase .st-ico { width: 18px; height: 18px; } .gen-phase .st-ico svg { width: 10px; height: 10px; }
  .title-input { font-size: 18px; font-weight: 700; border-color: transparent; padding-left: 0; }

  .title-input:focus { padding-left: 12px; }
  .dmod { overflow: visible; }

  .dmod-body { padding: 4px 16px 16px; border-top: 1px solid var(--border); background: var(--hover-4); border-radius: 0 0 12px 12px; }
  .dchap, .dquiz { margin-top: 14px; border: 1px solid var(--border-strong); border-radius: 12px; padding: 12px; background: #fff; }
  .dchap-head, .dlesson-head { display: flex; align-items: center; gap: 8px; }

  .block-text h3 { font-size: 16px; margin: 18px 0 8px; } .block-text h4 { font-size: 14.5px; margin: 14px 0 6px; }

    .form-row { grid-template-columns: 1fr 1fr; }

    .path-head { flex-wrap: wrap; align-items: flex-start; } .path-head > div:last-child { width: 100% !important; } .seg-btn { flex-basis: 100%; }
    .dmod-head { flex-wrap: wrap; } .dmod-title { flex: 1 1 60%; }

  /* ===== Panneau notifications ===== */
  .overlay { position: fixed; inset: 0; background: rgba(15,17,24,0.32); z-index: var(--z-backdrop); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .overlay.open { opacity: 1; pointer-events: auto; }

  .drawer.open { transform: translateX(0); }
  .drawer-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 8px; }

  .notif-ico { width: 30px; height: 30px; border-radius: 50%; background: var(--hover-1); color: var(--text-muted); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

  .notif-title { font-size: 13px; font-weight: 600; }
  .notif-body { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
  .notif-time { font-size: 11px; color: var(--text-faint); margin-top: 4px; }

  /* ===== Recherche globale ===== */
  .modal-overlay { position: fixed; inset: 0; background: rgba(15,17,24,0.45); display: none; align-items: flex-start; justify-content: center; z-index: var(--z-modal); padding: 10vh 16px 16px; }
  #modal.modal-overlay { align-items: center; padding: 16px; }
  .modal-overlay.open { display: flex; }
  .search-modal { background: var(--card); border-radius: var(--radius-lg); width: 100%; max-width: 620px; box-shadow: var(--shadow-modal); overflow: hidden; }
  .search-input-wrap { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .search-input-wrap svg { width: 18px; height: 18px; color: var(--text-faint); flex-shrink: 0; }

  .sr-item .s { font-size: 11.5px; color: var(--text-faint); }
  .sr-item svg { width: 15px; height: 15px; color: var(--text-muted); flex-shrink: 0; }
  mark { background: #fff0c2; color: inherit; border-radius: 3px; padding: 0 1px; }

  /* Toast */
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); background: var(--text); color: #fff; font-size: 13px; padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow-float); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: var(--z-float); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== Connexion (deux colonnes, comme le dashboard) ===== */
  #login { position: fixed; inset: 0; z-index: 9999; display: flex; background: #fff; }
  .login-left { flex: 0 0 40%; min-width: 0; display: flex; flex-direction: column; padding: 38px 52px; overflow-y: auto; }
  .login-brand { display: flex; align-items: center; gap: 10px; }
  .login-brand-word { font-size: 17px; font-weight: 300; color: #46555c; }
  .login-brand-word strong { font-weight: 800; color: #13242b; }
  .login-form-wrap { margin: auto; width: 100%; max-width: 330px; padding: 24px 0; }
  .login-h1 { font-size: 30px; line-height: 1.12; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 8px; }
  .login-sub { font-size: 14px; color: var(--text-muted); margin: 0 0 22px; }

  .login-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .login-link { display: block; margin: 12px auto 0; background: none; border: none; color: var(--accent, #266DF0); font: inherit; font-size: 13px; cursor: pointer; }
  .login-continue { width: 100%; margin-top: 22px; background: #111; color: #fff; border: none; border-radius: var(--radius-sm); padding: 11px; font: inherit; font-size: 14px; font-weight: 600; }
  .login-continue:hover { background: #000; }
  .login-alert { margin-top: 12px; font-size: 12.5px; color: var(--st-perdu-fg); background: var(--st-perdu-bg); border-radius: var(--radius-sm); padding: 9px 12px; display: none; }
  .demo-box { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--border); }
  .demo-title { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); font-weight: 600; margin-bottom: 8px; }

  /* ===== Structure des écrans (ordre d'importance, groupes, une action principale) ===== */
  .crumb a { color: var(--accent); font-weight: 500; }

  .block-label, .resume-kicker, .expert-card .k, .outline .chap-t, .vc-src, .code-head, .sr-group, .demo-title, .stub-step { font-size: var(--fs-eyebrow); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-faint); }

  .callout-t { font-size: var(--fs-head); font-weight: 600; text-transform: none; letter-spacing: 0; }

  /* Boutons : le principal se distingue par le style, pas par la taille des voisins */

  /* Page module : bloc d'introduction et liste groupée */

  .path-idx { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 700; margin-right: 10px; vertical-align: 2px; }
  .path-side { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: var(--fs-foot); white-space: nowrap; }

  /* ===== Passe 2 : structure plus marquée ===== */
  /* Fond groupé (gris clair) et blocs blancs : la figure se détache du fond */
  /* Fond blanc comme l'outil Hike UP : les blocs se détachent par un contour net et une ombre légère */
  .g-list, .m-list, .acc { background: var(--card); border: 1px solid var(--border-strong); box-shadow: var(--shadow-card); }
  .lesson-foot { background: var(--hover-4); }
  .preview-banner { border: 1px solid var(--border-strong); }
  /* Barre latérale : l'élément actif se voit au premier coup d'œil */
  /* Titre de page plus présent */
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .sec-head .h-section { margin: 0; }
  /* Tableau de bord : un bloc principal, une action */
  .hero { display: flex; align-items: center; gap: 32px; padding: 24px 28px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--border-strong); box-shadow: var(--shadow-card); }
  .hero-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .hero-k { font-size: var(--fs-eyebrow); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); }
  .hero-title { font-size: 20px; line-height: 26px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .hero-mod { display: flex; align-items: center; gap: 10px; font-size: var(--fs-foot); color: var(--text-muted); width: 280px; max-width: 100%; }
  .hero-mod .pbar { flex: 1; }

  .hero-ring { position: relative; width: 120px; height: 120px; flex-shrink: 0; }
  .ring-txt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .ring-txt b { font-size: var(--fs-kpi); line-height: 28px; font-variant-numeric: tabular-nums; } .ring-txt span { font-size: 11px; color: var(--text-muted); max-width: 80px; }
  .stat-strip { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 12px; background: var(--card); border: 1px solid var(--border-strong); border-radius: var(--radius); box-shadow: var(--shadow-card); }
  .stat-strip > * { padding: 14px 20px; display: flex; align-items: baseline; gap: 8px; font-size: var(--fs-sub); color: var(--text-muted); }
  .stat-strip > * + * { border-left: 1px solid var(--border); }

  .step-strip { display: flex; align-items: center; gap: 5px; margin: -8px 0 22px; }

  /* ===== Fiches structurées (cursus, profil, membres) ===== */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .tab { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: none; background: none; font: inherit; font-size: 13.5px; font-weight: 500; color: var(--text-muted); border-radius: var(--radius-sm) var(--radius-sm) 0 0; }

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const DAY = 86400000;
const NOW = Date.now();
const daysAgo = n => new Date(NOW - n * DAY).toISOString();
const PALETTE = ["#fde0e9", "#d6f1dc", "#fff0c2", "#ffd9da", "#d8eff3", "#e0e4ff", "#f4e0ff", "#d9efe9"];
function hashColor(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; }
function initials(name) { const p = String(name || '').trim().split(/\s+/); return ((p[0] || '')[0] || '') + ((p[1] || '')[0] || ''); }
function avatar(u, size = 32) {
  if (!u) return '';
  const inner = u.avatar_url ? `<img src="${esc(u.avatar_url)}" alt="">` : esc(initials(u.full_name));
  return `<span class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.36)}px;background:${hashColor(u.id)}">${inner}</span>`;
}
function relTime(iso) {
  const d = Math.floor((NOW - new Date(iso).getTime()) / 60000);
  if (d < 1) return "à l'instant";
  if (d < 60) return `il y a ${d} min`;
  if (d < 1440) return `il y a ${Math.floor(d / 60)} h`;
  const j = Math.floor(d / 1440);
  return j === 1 ? 'hier' : `il y a ${j} jours`;
}
function fmtMin(m) { if (!m) return ''; const h = Math.floor(m / 60), r = m % 60; return h ? `${h} h${r ? ' ' + String(r).padStart(2, '0') : ''}` : `${r} min`; }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }

gion", "Je sais exporter une liste vers Clay"]}]}, {"t": "Clay : prise en main", "min": 35, "blocks": [{"type": "text", "html": "<p>Clay est notre atelier de listes : on y trouve des entreprises et des contacts, on les enrichit, on les nettoie et on y rédige les personnalisations avec l'IA. Commencez par le cours Clay 101 : ces quatre vidéos posent les bases.</p><p>Le principe à retenir : <strong>Find, Enrich, Transform, Export</strong>. Chaque table suit ces étapes.</p>"}, {"type": "video", "url": "https://university.clay.com/lessons/get-started-in-clay", "title": "Get Started in Clay", "source": "Clay University"}, {"type": "video", "url": "https://university.clay.com/lessons/intro-to-clay-101-fete-jigsaw", "title": "Intro to Clay 101 : FETE & Jigsaw", "source": "Clay University"}, {"type": "video", "url": "https://university.clay.com/lessons/finding-companies-in-clay", "title": "Finding Companies in Clay", "source": "Clay University"}, {"type": "video", "url": "https://university.clay.com/lessons/finding-people-in-clay", "title": "Finding People in Clay", "source": "Clay University"}, {"type": "link", "url": "https://university.clay.com/courses/clay-101", "title": "Cours complet Clay 101", "caption": "18 leçons courtes, à suivre en entier pendant la première semaine"}, {"type": "checklist", "title": "Avant de passer à la suite", "items": ["J'ai suivi les 4 vidéos", "Je sais expliquer Find, Enrich, Transform, Export", "J'ai créé une table de test"]}]}, {"t": "Fullenrich dans Clay", "min": 20, "blocks": [{"type": "text", "html": "<p>Fullenrich trouve les emails professionnels et les numéros de mobile en interrogeant plusieurs fournisseurs en cascade. Chez nous, on l'utilise directement depuis Clay, grâce à l'intégration native : deux actions, <strong>Find work email</strong> et <strong>Find mobile phone</strong>.</p><p><strong>Règle :</strong> aucun crédit ne se dépense sans validation. On teste sur quelques lignes avant de lancer sur toute la table.</p><blockquote ue, achats, production…) revoit ses fournisseurs dans ses premiers mois. C'est le bon moment pour la contacter, avec une raison claire de le faire.</p><ul><li>Recrutement de moins de 90 jours sur une fonction cible</li><li>Entreprise dans la cible du client</li><li>Message qui fait référence à la prise de poste</li></ul><blockquote>Chez Hike UP : [À compléter par le référent : règles maison, exemples clients, captures]</blockquote>"}, {"type": "video", "url": "https://university.clay.com/lessons/intro-to-signals-in-clay-signals-abm", "title": "Intro to Signals in Clay", "source": "Clay University"}, {"type": "video", "url": "https://university.clay.com/lessons/types-of-signals-in-clay-signals-abm", "title": "Types of Signals in Clay", "source": "Clay University"}]}, {"t": "Le signal New hire dans Clay", "min": 30, "blocks": [{"type": "text", "html": "<p>Clay surveille une liste d'entreprises et remonte les personnes recrutées dans les trois derniers mois. Le réglage se fait dans <strong>Tools &gt; Signals &gt; New hire</strong> : table d'entreprises, identifiant (site ou URL LinkedIn), filtres de fonctions, fréquence d'exécution.</p><p>Les offres d'emploi publiées sont un second signal utile : une entreprise qui recrute est une entreprise qui bouge.</p>"}, {"type": "video", "url": "https://university.clay.com/lessons/setting-up-signals-in-clay", "title": "Setting Up Signals in Clay", "source": "Clay University"}, {"type": "link", "url": "https://university.clay.com/docs/new-hire-signal-overview", "title": "Monitor for new hire (doc Clay)", "caption": "Le pas-à-pas officiel du signal New hire"}, {"type": "video", "url": "https://university.clay.com/lessons/find-jobs-source-enrichment-clay-101", "title": "Finding Jobs : source + enrichissement", "source": "Clay University"}, {"type": "checklist", "title": "Avant de passer à la suite", "items": ["Je sais créer un signal New hire sur une table d'entreprises", "Je sais filtrer les fonctions à surveiller"]}]}, {"t": "Les nouveaux recrutements dans Sales Navigator", "min": 30, "blocks": [{"type": "text", "html": "<p>Dans Sales Navigator, la recherche de leads permet de cibler les personnes qui <strong>ont changé de poste récemment</strong>, combinée aux filtres de fonction, séniorité, secteur et zone géographique. On enregistre la recherche pour la réutiliser.</p><blockquote>Chez Hike UP : [À compléter par le référent : règles maison, exemples clients, captures]</blockquote>"}, {"type": "link", "url": "https://business.linkedin.com/sales-solutions/sales-navigator/how-to-use-linkedin-sales-navigator", "title": "Bien utiliser Sales Navigator (LinkedIn)", "caption": "Guide officiel LinkedIn : recherches, filtres, listes"}, {"type": "video", "url": "", "caption": "Démo Hike UP : nos filtres Sales Navigator pour les recrutements récents (Loom à enregistrer)"}, {"type": "checklist", "title": "Avant de passer à la suite", "items": ["Je sais construire une recherche de leads « changement de poste récent »", "Je sais enregistrer une recherche"]}]}, {"t": "Pousser la recherche Sales Navigator dans Clay", "min": 25, "blocks": [{"type": "text", "html": "<p>On colle l'URL d'une <strong>recherche de personnes</strong> Sales Navigator dans Clay pour importer les leads, puis on les enrichit (email, téléphone) et on les rattache à la bonne entreprise.</p><ul><li>Utiliser une URL de recherche de personnes, pas de recherche d'entreprises</li><li>Ne pas filtrer sur une liste de leads enregistrée dans un compte personnel</li><li>Vérifier les doublons avec les contacts déjà connus avant d'enrichir</li></ul>"}, {"type": "link", "url": "https://www.clay.com/claybooks/enrich-sales-navigator-lists-with-work-emails-and-phone-numbers", "title": "Claybook : enrichir une liste Sales Navigator", "caption": "Modèle Clay prêt à copier, avec démo interactive"}, {"type": "link", "url": "https://university.clay.com/claybooks/monitor-job-movers-across-the-entire-market", "title": "Claybook : suivre les changements de poste du marché", "caption": "Surveiller en continu les personnes qui changent de poste"}, {"type": "checklist", "title": "Avant de passer à la suite", "items": ["J'ai importé une recherche Sales Navigator dans une table Clay", "J'ai vérifié les doublons avant d'enrichir"]}]}]}, {"t": "Contacts et enrichissement", "o": "Trouver les bons décideurs et compléter entreprises et contacts sans gaspiller de crédits.", "d": 180, "tool": "t_clay", "expert": "u_ref2", "quiz": true, "ex": true, "exi": "Sur une table de 20 entreprises cibles, trouvez 2 décideurs par entreprise, enrichissez-les (email, téléphone pour les prioritaires) en suivant la règle de validation des crédits. Déposez le lien de la table et le nombre de crédits utilisés.", "c": [{"t": "Trouver les bons contacts", "min": 30, "blocks": [{"type": "text", "html": "<p>On part des personas du client : fonctions, séniorité, services. On cherche ensuite les personnes correspondantes dans les entreprises de la table (Find People dans Clay, Bizzy, LinkedIn).</p><blockquote>Chez Hike UP : [À compléter par le référent : règles maison, exemples clients, captures]</blockquote>"}, {"type": "video", "url": "https://university.clay.com/lessons/finding-people-in-clay", "title": "Finding People in Clay", "source": "Clay University"}, {"type": "video", "url": "https://university.clay.com/lessons/find-your-icp-with-ai", "title": "Find Your ICP with AI", "source": "Clay University"}, {"type": "checklist", "title": "Avant de passer à la suite", "items": ["Je sais traduire un persona client en filtres de recherche", "Je sais rattacher des contacts à leurs entreprises"]}]}, {"t": "Enrichir entreprises et contacts", "min": 35, "blocks": [{"type": "text", "html": "<p>Enrichir, c'est ajouter les informations manquantes : taille, secteur, site, LinkedIn pour les entreprises ; poste, email, téléphone pour les contacts. Clay propose des centaines de sources : on choisit celles qui répondent au besoin du client.</p>"}, {"type": "video", "url": "https://university.clay.com/lessons/enrich-add-data-to-your-table", "title": "(Enrich) Add Data To Your Table", "source": "Clay University"}, {"type": "video", "url": "https://university.clay.com/lessons/enriching-company-data", "title": "Enriching Company Data", "source": "Clay University"}, {"type": "video", "url": "https://university.clay.com/lessons/enriching-people-data", "title": "Enriching People Data", "source": "Clay University"}, {"type": "video", "url": "https://university.clay.com/lessons/enriching-with-claygent", "title": "Enriching with Claygent", "source": "Clay University"}]}, {"t": "Waterfall : emails et téléphones", "min": 30, "blocks": [{"type": "text", "html": "<p>Une waterfall interroge plusieurs fournisseurs dans l'ordre et s'arrête dès qu'une donnée valide est trouvée. On paie donc moins, pour un meilleur taux de remplissage. Fullenrich applique déjà ce principe à lui seul.</p>"}, {"type": "video", "url": "https://university.clay.com/lessons/enrich-companies-waterfalls-automated-outbound", "title": "Enrich Companies (Waterfalls)", "source": "Clay University"}, {"type": "video", "url": "https://university.clay.com/lessons/enrich-people-waterfalls-automated-outbound", "title": "Enrich People (Waterfalls)", "source": "Clay University"}, {"type": "link", "url": "https://university.clay.com/docs/building-a-data-waterfall", "title": "Construire une waterfall (doc Clay)", "caption": "Ordre des fournisseurs, conditions d'arrêt, validation"}]}, {"t": "Gestion des crédits", "min": 20, "blocks": [{"type": "text", "html": "<p><strong>Règle Hike UP : aucun crédit ne se dépense sans validation explicite.</strong> On teste toujours sur quelques lignes, on contrôle, puis on lance sur la table entière.</p><ul><li>Exécutions conditionnelles : n'enrichir que les lignes qui en ont besoin</li><li>Téléphones mobiles réservés aux contacts prioritaires</li><li>Toujours vérifier les doublons avant d'enrichir</li></ul><blockquote>Chez Hike UP : [À compléter par le référent : règles maison, exemples clients, captures]</blockquote>"}, {"type": "video", "url": "https://university.clay.com/lessons/best-practices-to-maximize-your-credits", "title": "Best Practices To Maximize Your Credits", "source": "Clay University"}, {"type": "video", "url": "https://university.clay.com/lessons/ai-formulas-conditional-runs-automated-outbound", "title": "AI Formulas + Conditional Runs", "source": "Clay University"}, {"type": "checklist", "title": "Avant de passer à la suite", "items": ["Je fais valider avant toute dépense de crédits", "Je teste sur quelques lignes avant de lancer", "Je sais paramétrer une exécution conditionnelle"]}]}]}, {"t": "Process de cleaning d'une table Clay", "o": "Livrer au client une table propre, homogène, sans doublons et contrôlée.", "d": 150, "tool": "t_clay", "expert": "u_ref1", "quiz": true, "ex": true, "exi": "Prenez une table Clay brute fournie par votre référent et appliquez tout le process de cleaning : normalisation, dédoublonnage, contrôle qualité. Déposez le lien de la table et votre checklist complétée.", "c": [{"t": "Nettoyer et normaliser les données", "min": 30, "blocks": [{"type": "text", "html": "<p>On harmonise avant de livrer : noms d'entreprises sans forme juridique, domaines sans http ni www, numéros au format international, fonctions et secteurs regroupés dans des catégories standard.</p><ul><li>Normaliser les noms d'entreprises et les domaines</li><li>Formater téléphones et numéros de TVA</li><li>Standardiser fonctions et secteurs (formules ou IA)</li></ul><blockquote>Chez Hike UP : [À compléter par le référent : règles maison, exemples clients, captures]</blockquote>"}, {"type": "video", "url": "https://university.clay.com/lessons/transform-clean-normalize-your-data", "title": "(Transform) Clean & Normalize Your Data", "source": "Clay University"}, {"type": "video", "url": "https://university.clay.com/lessons/data-cleaning-normalization-automated-outbound", "title": "Data Cleaning + Normalization", "source": "Clay University"}, {"type": "video", "url": "https://university.clay.com/lessons/transform-data-into-clear-classifications", "title": "Transform Data Into Clear Classifications", "source": "Clay University"}]}, {"t": "Dédoublonner une table", "min": 20, "blocks": [{"type": "text", "html": "<p>Les doublons coûtent des crédits et gênent le client. Clay dédoublonne sur une colonne à la fois (domaine pour les entreprises, URL LinkedIn ou email pour les contacts). L'option de dédoublonnage automatique évite d'en recréer à chaque import.</p><blockquote>Chez Hike UP : [À compléter par le référent : règles maison, exemples clients, captures]</blockquote>"}, {"type": "link", "url": "https://community.clay.com/x/support/lqv9irieqts1/how-to-delete-duplicate-rows-from-a-clay-table", "title": "Supprimer les doublons dans Clay (communauté Clay)", "caption": "Les deux méthodes : manuelle et automatique"}, {"type": "checklist", "title": "Avant de passer à la suite", "items": ["Je dédoublonne avant tout enrichissement", "Je sais choisir la bonne colonne de dédoublonnage"]}]}, {"t": "Contrôle qualité avant envoi au client", "min": 25, "blocks": [{"type": "text", "html": "<p>Dernière étape avant la livraison : filtrer les lignes vides, vérifier le taux de remplissage, relire un échantillon, puis exporter au format attendu par le client.</p><blockquote>Chez Hike UP : [À compléter par le référent : règles maison, exemples clients, captures]</blockquote>"}, {"type": "video", "url": "https://university.clay.com/lessons/export-getting-your-lists-out-of-clay", "title": "(Export) Getting Your Lists Out of Clay", "source": "Clay University"}, {"type": "checklist", "title": "Avant de passer à la suite", "items": ["J'ai filtré les lignes incomplètes", "J'ai relu un échantillon de 20 lignes", "J'ai vérifié le format d'export demandé par le client"]}]}]}, {"t": "Utiliser l'IA dans Clay", "o": "Produire des personnalisations IA fiables : persona, icebreaker, email, salutation, et les contrôler.", "d": 210, "tool": "t_clay", "expert": "u_ref1", "quiz": true, "ex": true, "exi": "Sur 20 contacts d'une campagne, créez les colonnes IA persona, salutation, icebreaker et email. Relisez et corrigez les sorties. Déposez le lien de la table et vos prompts.", "c": [{"t": "Les bases : formules IA et Claygent", "min": 30, "blocks": [{"type": "text", "html": "<p>Deux outils IA dans Clay : les <strong>formules IA</strong> pour transformer ce qui est déjà dans la table, et <strong>Claygent</strong> pour aller chercher une information sur le web. Un bon prompt donne le contexte, la tâche, le format de sortie et des exemples.</p>"}, {"type": "video", "url": "https://university.clay.com/lessons/transforming-with-ai-formulas", "title": "Transforming with AI Formulas", "source": "Clay University"}, {"type": "video", "url": "https://university.clay.com/lessons/claygent-ai-web-scraper-automated-outbound", "title": "Claygent : AI Web Scraper", "source": "Clay University"}, {"type": "video", "url": "https://university.clay.com/lessons/11-ai-prompts-to-automate-prospect-research-with-claygent-automated-outbound", "title": "11 prompts de recherche avec Claygent", "source": "Clay University"}]}, {"t": "Définir le persona", "min": 25, "blocks": [{"type": "text", "html": "<p>On demande à l'IA de classer chaque contact dans un persona du client (décideur technique, achats, direction…) à partir de son intitulé de poste. Le persona sert ensuite à choisir l'angle du message.</p><blockquote>Chez Hike UP : [À compléter par le référent : règles maison, exemples clients, captures]</blockquote>"}, {"type": "video", "url": "https://university.clay.com/lessons/transform-data-into-clear-classifications", "title": "Transform Data Into Clear Classifications", "source": "Clay University"}, {"type": "checklist", "title": "Avant de passer à la suite", "items": ["Mes personas ont une liste fermée de valeurs", "J'ai vérifié 20 classements à la main"]}]}, {"t": "Icebreakers personnalisés", "min": 30, "blocks": [{"type": "text", "html": "<p>Une phrase d'accroche qui montre qu'on connaît l'entreprise ou la personne : actualité, recrutement, projet, publication. Elle doit être vraie, précise et courte.</p><blockquote>Chez Hike UP : [À compléter par le référent : règles maison, exemples clients, captures]</blockquote>"}, {"type": "video", "url": "https://university.clay.com/lessons/intro-to-ai-snippets-copywriting-automated-outbound", "title": "Intro to AI Snippets (Copywriting)", "source": "Clay University"}, {"type": "video", "url": "https://university.clay.com/lessons/write-personalized-messages-that-land", "title": "Write Personalized Messages That Land", "source": "Clay University"}]}, {"t": "Emails de prospection", "min": 30, "blocks": [{"type": "text", "html": "<p>L'IA assemble l'email à partir des colonnes de la table (persona, icebreaker, offre du client). On garde un modèle stable et on ne fait varier que les parties personnalisées.</p><blockquote>Chez Hike UP : [À compléter par le référent : règles maison, exemples clients, captures]</blockquote>"}, {"type": "video", "url": "https://university.clay.com/lessons/create-personalized-content-at-scale", "title": "Create Personalized Content at Scale", "source": "Clay University"}, {"type": "video", "url": "https://university.clay.com/lessons/we-made-24-prompts-so-you-dont-have-to-automated-outbound", "title": "We Made 24 Prompts So You Don't Have To", "source": "Clay University"}]}, {"t": "Salutations et formules adaptées", "min": 20, "blocks": [{"type": "text", "html": "<p>La salutation dépend du genre, de la langue (français, néerlandais, allemand, anglais) et du niveau de formalité attendu par le client : « Madame », « Geachte heer », « Sehr geehrte Frau »… On la génère dans une colonne dédiée, avec une valeur neutre quand le genre est incertain.</p><blockquote>Chez Hike UP : [À compléter par le référent : règles maison, exemples clients, captures]</blockquote>"}, {"type": "video", "url": "https://university.clay.com/lessons/transforming-with-ai-formulas", "title": "Transforming with AI Formulas", "source": "Clay University"}, {"type": "checklist", "title": "Avant de passer à la suite", "items": ["Ma salutation gère les 4 langues du client", "J'utilise une formule neutre en cas de doute"]}]}, {"t": "Contrôle qualité des sorties IA", "min": 25, "blocks": [{"type": "text", "html": "<p>Avant tout envoi : relire un échantillon, vérifier qu'aucun fait n'est inventé, que le ton et la langue sont justes, et que les cas vides sont gérés (pas de phrase cassée quand une donnée manque).</p><blockquote>Chez Hike UP : [À compléter par le référent : règles maison, exemples clients, captures]</blockquote>"}, {"type": "checklist", "title": "Avant de passer à la suite", "items": ["J'ai relu 20 sorties au hasard", "Aucun fait inventé", "Les cas sans donnée donnent un texte propre"]}]}]}, {"t": "Mise en situation finale", "o": "Démontrer l'autonomie sur un cas complet, de la cible à la liste personnalisée.", "d": 240, "tool": null, "expert": "u_ref1", "quiz": false, "ex": true, "exi": "Cas complet pour un client réel : liste d'entreprises (Bizzy ou Clay), signal new hire, contacts, enrichissement validé, cleaning et personnalisation IA. Déposez la table finale et présentez-la à votre référent.", "c": [{"t": "Cas pratique complet : de la cible à la liste enrichie et personnalisée", "min": 20, "blocks": [{"type": "text", "html": "<p>Vous enchaînez tout ce que vous avez appris, sur un vrai brief client. Votre référent vous transmet le brief et reste disponible pour les validations de crédits.</p><blockquote>Chez Hike UP : [À compléter par le référent : règles maison, exemples clients, captures]</blockquote>"}]}, {"t": "Revue par le référent", "min": 15, "blocks": [{"type": "text", "html": "<p>Le référent relit la table avec vous : ciblage, qualité des données, crédits utilisés, personnalisations. Il valide l'exercice ou demande des corrections.</p>"}]}]}];
  MODS.forEach((m, i) => {

      if (j === m.c.length - 1) {

  });
  // Leçon de démonstration : tous les types de blocs, pour voir le rendu (contenu à remplacer)
